<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#08080d;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  overflow:hidden;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  height:100vh;
  max-width:620px;
  margin:auto;
  background:#08080d;
  position:relative;
  overflow:hidden;
}

.topbar{
  height:68px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  background:#0d0d14;
  border-bottom:1px solid #272733;
  position:relative;
  z-index:20;
}

.logo{
  font-size:30px;
  font-weight:900;
  letter-spacing:5px;
}

.logo .pink{
  color:#e33dff;
}

.userButton{
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:#191923;
  color:white;
  font-size:21px;
}

.content{
  height:calc(100vh - 128px);
  overflow-y:auto;
  padding:18px;
  padding-bottom:90px;
}

.hero{
  min-height:470px;
  border-radius:30px;
  padding:28px;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  overflow:hidden;
  position:relative;
