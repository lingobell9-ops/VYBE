<style>
:root{--bg:#050507;--p:#0d0d12;--p2:#15151d;--l:#282833;--t:#fff;--m:#a3a3ae;--pk:#ff2bd6;--pu:#8b5cff;--bl:#25c8ff;--rd:#ff4f6d}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,system-ui,Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;color:#fff;border:0}.top{position:fixed;z-index:90;top:0;left:0;right:0;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#050507d9;backdrop-filter:blur(16px)}.logo{font-size:25px;font-weight:1000;letter-spacing:3px;background:linear-gradient(90deg,var(--pk),var(--pu),var(--bl));-webkit-background-clip:text;color:transparent}.icons{display:flex;gap:8px}.icon,.round{width:40px;height:40px;border-radius:50%;background:#ffffff0b;border:1px solid #ffffff16}.home{width:min(760px,100%);margin:auto;padding:60px 0 76px}.tabs{position:fixed;z-index:80;top:60px;width:min(760px,100%);display:flex;justify-content:center;gap:24px;padding:9px;background:#050507cc;backdrop-filter:blur(8px)}.tabs button{background:none;color:#aaa;padding:5px;border-bottom:2px solid transparent}.tabs .on{color:#fff;border-color:#fff}.feed{padding-top:39px}.cardv{height:calc(100vh - 140px);min-height:500px;position:relative;overflow:hidden;margin-bottom:3px;background:linear-gradient(145deg,#191020,#07090e);border:1px solid #ffffff12;border-radius:18px;scroll-snap-align:start}.media{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,#ff2bd62b,transparent 30%),radial-gradient(circle at 75% 75%,#25c8ff22,transparent 32%),linear-gradient(160deg,#1b1025,#07090e)}.media video,.media img{width:100%;height:100%;object-fit:cover}.shade{position:absolute;inset:0;background:linear-gradient(#0003,transparent 35%,#000d)}.vtext{position:absolute;z-index:3;left:15px;right:75px;bottom:20px}.vactions{position:absolute;z-index:4;right:10px;bottom:20px;display:grid;gap:13px}.act{background:none;display:grid;gap:3px;justify-items:center;font-size:10px}.act b{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#ffffff12;border:1px solid #ffffff18;font-size:20px}.avatar{width:44px;height:44px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:linear-gradient(135deg,var(--pk),var(--pu),var(--bl));font-weight:1000;border:2px solid #fff}.avatar img{width:100%;height:100%;object-fit:cover}.vuser{display:flex;align-items:center;gap:8px;margin-bottom:10px}.follow,.pill{padding:5px 9px;border-radius:999px;background:#ffffff10;border:1px solid #ffffff25;font-size:10px}.bottom{position:fixed;z-index:95;bottom:0;left:0;right:0;height:72px;background:#050507f5;border-top:1px solid var(--l);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}.bottom button{background:none;color:#999;font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.bottom button.on{color:#fff}.bottom strong{font-size:19px}.plus{width:45px;height:31px;border-radius:9px;background:linear-gradient(90deg,var(--bl),#fff,var(--pk));color:#050507;display:grid;place-items:center;font-size:20px}.page{width:min(760px,100%);margin:auto;padding:76px 14px 90px;display:none}.page.show{display:block}.hero{padding:24px;min-height:280px;border-radius:24px;border:1px solid var(--l);background:radial-gradient(circle at 80% 20%,#ff2bd633,transparent 35%),radial-gradient(circle at 20% 70%,#25c8ff22,transparent 35%),linear-gradient(145deg,#1b1024,#090a10);display:flex;flex-direction:column;justify-content:flex-end}.hero h1{font-size:40px;line-height:1.02;margin:9px 0}.grad{background:linear-gradient(90deg,var(--pk),var(--pu),var(--bl));-webkit-background-clip:text;color:transparent}.muted{color:var(--m);font-size:13px;line-height:1.5}.box,.tile{background:var(--p);border:1px solid var(--l);border-radius:18px;padding:15px;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{min-height:120px;text-align:left;background:linear-gradient(145deg,var(--p2),#0a0a0e)}.tile b{font-size:16px}.tile small{display:block;color:var(--m);margin-top:6px;line-height:1.4}.primary{background:linear-gradient(90deg,var(--pk),var(--pu));padding:12px 15px;border-radius:12px;font-weight:900;margin-top:12px}.secondary{background:var(--p2);border:1px solid var(--l);padding:10px 13px;border-radius:11px}.danger{background:#ff4f6d18;color:#ff9aaa;border:1px solid #ff4f6d44;padding:10px 13px;border-radius:11px}.field,.area{width:100%;background:#08080d;color:#fff;border:1px solid var(--l);border-radius:12px;padding:12px;outline:0}.area{min-height:110px}.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.modal{position:fixed;inset:0;z-index:200;background:#000d;display:flex;align-items:center;justify-content:center;padding:14px}.modalbox{width:min(560px,100%);max-height:92vh;overflow:auto;background:#101016;border:1px solid var(--l);border-radius:20px;padding:18px}.close{float:right}.form{display:grid;gap:9px}.list{display:grid;gap:8px}.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;background:var(--p2);border:1px solid var(--l);border-radius:13px}.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpi div{background:var(--p2);border:1px solid var(--l);border-radius:14px;padding:12px}.kpi b{display:block;font-size:18px}.kpi small{color:var(--m)}.giftgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.gift,.variant{background:var(--p2);border:1px solid var(--l);border-radius:13px;padding:10px;text-align:center}.gift .e,.variant .e{display:block;font-size:32px;margin-bottom:5px}.gift small{color:var(--m)}.variantgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.profilecover{height:180px;border-radius:18px 18px 0 0;background:linear-gradient(135deg,#1a1023,#09111b)}.big{width:90px;height:90px;border-radius:50%;overflow:hidden;border:4px solid var(--bg);background:linear-gradient(135deg,var(--pk),var(--pu),var(--bl));display:grid;place-items:center;font-weight:1000;font-size:27px}.big img{width:100%;height:100%;object-fit:cover}.profilebody{margin-top:-45px;padding:0 15px 15px}.founder{border-color:#ff2bd66b;box-shadow:0 0 35px #ff2bd611}.room{position:fixed;inset:0;z-index:150;background:#020205;display:none}.room.show{display:block}.roomvideo{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 25%,#35122f,#040407 58%)}.roomvideo video{width:100%;height:100%;object-fit:cover}.roomshade{position:absolute;inset:0;background:linear-gradient(#0007,transparent 35%,#000d)}.roomtop,.roombot{position:absolute;z-index:3;left:12px;right:12px;display:flex;gap:8px;align-items:center}.roomtop{top:12px;justify-content:space-between}.roombot{bottom:14px}.comments{position:absolute;z-index:3;left:12px;bottom:85px;width:75%;max-height:30vh;overflow:hidden}.comment{width:max-content;max-width:100%;background:#0008;border-radius:11px;padding:6px 9px;margin-top:4px;font-size:12px}.toast{position:fixed;z-index:300;bottom:88px;left:50%;transform:translateX(-50%);display:none;background:#20202a;border:1px solid var(--l);padding:11px 14px;border-radius:12px;max-width:92%;text-align:center;font-size:13px}
@media(min-width:900px){.bottom{display:none}.home{padding-bottom:20px}.cardv{border-radius:18px}}@media(max-width:520px){.grid{grid-template-columns:1fr 1fr}.hero h1{font-size:34px}.cardv{border-radius:0}.giftgrid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header class="top"><button class="logo" onclick="go('home')">VYBE</button><div class="icons"><button class="icon" onclick="openSearch()">⌕</button><button class="icon" onclick="go('notifications')">♡</button><button class="icon" onclick="go('profile')">●</button></div></header>

<section id="home" class="home">
<div class="tabs"><button id="followingTab" onclick="setFeed('following')">Following</button><button id="forYouTab" class="on" onclick="setFeed('foryou')">For You</button><button onclick="openLiveDirectory()">LIVE</button></div>
<div id="feed" class="feed"></div>
</section>

<main id="root"></main>
<nav class="bottom"><button id="homeNav" class="on" onclick="go('home')"><strong>⌂</strong><span>Home</span></button><button onclick="openSearch()"><strong>⌕</strong><span>Discover</span></button><button onclick="openCreate()"><span class="plus">+</span><span>Create</span></button><button onclick="openLiveDirectory()"><strong>LIVE</strong><span>LIVE</span></button><button onclick="go('profile')"><strong>●</strong><span>Profile</span></button></nav>

<div id="room" class="room"><div id="roomVideo" class="roomvideo"></div><div class="roomshade"></div><div class="roomtop"><div class="row"><button class="round" onclick="closeRoom()">×</button><span id="roomTitle" class="pill">VYBE LIVE</span></div><div class="row"><button class="round" onclick="toggleMic()">🎙</button><button class="round" onclick="flipCamera()">↺</button><button class="round" onclick="liveSettings()">⚙</button></div></div><div id="comments" class="comments"></div><div class="roombot"><input id="commentInput" class="field" placeholder="Say something…" onkeydown="if(event.key==='Enter')sendComment()"><button class="primary" style="margin:0" onclick="sendComment()">Send</button><button class="primary" style="margin:0" onclick="openGiftPicker()">🎁</button></div></div>
<div id="modalRoot"></div><div id="toast" class="toast"></div>

<script defer src="https://olttlqjgzxtvlriyoipe.supabase.co/functions/v1/vybe-core-engine"></script>
<script defer src="https://olttlqjgzxtvlriyoipe.supabase.co/functions/v1/vybe-gift-engine"></script>
<script defer src="https://olttlqjgzxtvlriyoipe.supabase.co/functions/v1/vybe-camera-engine"></script>
<script defer src="https://olttlqjgzxtvlriyoipe.supabase.co/functions/v1/vybe-profile-engine"></script>
<script>
const URL="https://olttlqjgzxtvlriyoipe.supabase.co";
const KEY="sb_publishable_2uhP7sc-G8MG-tJfNpH6GQ_6z4uaDZC";
const sb=window.supabase?.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}})||null;
const S={user:null,p:null,founder:false,coins:0,earn:0,pending:0,feed:"foryou",videos:[],posts:[],gifts:[],live:null,camera:null,mic:true,page:"home"};
Object.defineProperty(S,"profile",{get(){return S.p},set(v){S.p=v},configurable:true});
window.sb=sb; window.state=S;
const esc=v=>String(v??"").replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const initials=n=>(String(n||"V").trim()[0]||"V").toUpperCase();
const money=n=>"R "+Number(n||0).toFixed(2);
function toast(x){const t=document.getElementById("toast");if(!t)return;t.textContent=x;t.style.display="block";clearTimeout(window.tt);window.tt=setTimeout(()=>t.style.display="none",2700)}
function modal(x){document.getElementById("modalRoot").innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modalbox">${x}</div></div>`}
function closeModal(){document.getElementById("modalRoot").innerHTML=""}
function av(p=S.p,big=false){const c=big?"big":"avatar";return p?.avatar_url?`<div class="${c}"><img src="${esc(p.avatar_url)}"></div>`:`<div class="${c}">${esc(initials(p?.display_name||S.user?.email))}</div>`}
function needUser(){if(!S.user){auth("login");return false}return true}
async function load(){
 if(!sb){renderFeed();return;}
 try{
  const u=await sb.auth.getUser();
  S.user=u.data?.user||null;
  if(S.user){
   const p=await sb.from("profiles").select("*").eq("id",S.user.id).maybeSingle();
   S.p=p.data||{}; S.founder=!!S.p.is_vybe_owner; await wallet();
  }else{S.p=null;S.founder=false;}
  await Promise.allSettled([feed(),gifts()]);
  render();
 }catch(e){console.warn("VYBE load",e);render();}
}
async function wallet(){if(!S.user)return;const w=await sb.from("wallets").select("coin_balance").eq("user_id",S.user.id).maybeSingle();const e=await sb.from("creator_earnings").select("creator_value_zar,cash_status").eq("creator_id",S.user.id);S.coins=Number(w.data?.coin_balance||0);S.earn=(e.data||[]).filter(x=>x.cash_status==="available").reduce((a,x)=>a+Number(x.creator_value_zar||0),0);S.pending=(e.data||[]).filter(x=>x.cash_status==="pending").reduce((a,x)=>a+Number(x.creator_value_zar||0),0)}
async function feed(){
 const [v,p]=await Promise.all([
  sb.from("videos").select("*").order("created_at",{ascending:false}).limit(40),
  sb.from("posts").select("*").order("created_at",{ascending:false}).limit(40)
 ]);
 S.videos=v.error?[]:(v.data||[]); S.posts=p.error?[]:(p.data||[]);
 const ids=[...new Set([...S.videos,...S.posts].map(x=>x.user_id).filter(Boolean))];
 if(ids.length){const pr=await sb.from("profiles").select("id,username,display_name,avatar_url,bio,is_vybe_owner").in("id",ids);const map=Object.fromEntries((pr.data||[]).map(x=>[x.id,x]));S.videos=S.videos.map(x=>({...map[x.user_id],...x}));S.posts=S.posts.map(x=>({...map[x.user_id],...x}));}
}
async function gifts(){const g=await sb.from("gifts").select("*").eq("is_active",true).order("coin_cost");S.gifts=g.error?[]:g.data||[]}
function media(x){return x?.video_url||x?.media_url||x?.url||x?.file_url||""}
function renderFeed(){let a=S.videos.map(x=>({...x,t:"video"}));if(!a.length)a=S.posts.map(x=>({...x,t:"post"}));document.getElementById("feed").innerHTML=a.length?a.map(card).join(""):`<div class="hero"><span class="pill">WELCOME TO VYBE</span><h1>Your world.<br><span class="grad">Your VYBE.</span></h1><p class="muted">Create, watch, challenge, go LIVE, send Gifts and build your community.</p><button class="primary" onclick="openCreate()">Create your first VYBE</button></div>`}
function card(x){const id=esc(x.id||""),uid=esc(x.user_id||""),t=esc(x.t||"post"),m=media(x);const body=m?`<video src="${esc(m)}" playsinline loop muted controlslist="nodownload" onclick="this.paused?this.play():this.pause()"></video>`:x.thumbnail_url?`<img src="${esc(x.thumbnail_url)}">`:`<div style="font-size:60px;font-weight:1000">VYBE</div>`;return `<article class="cardv"><div class="media">${body}</div><div class="shade"></div><div class="vtext"><div class="vuser">${av({display_name:x.display_name||x.username,avatar_url:x.avatar_url})}<div><b>@${esc(x.username||"creator")}</b><div class="muted">${esc(x.display_name||"VYBE Creator")}</div></div><button class="follow" onclick="follow('${uid}')">Follow</button></div><div>${esc(x.caption||x.description||x.text||"Welcome to VYBE.")}</div><div class="muted">#VYBE #ForYou</div></div><div class="vactions"><button class="act" onclick="like('${id}','${t}')"><b>♥</b>Like</button><button class="act" onclick="comment('${id}','${t}')"><b>💬</b>Comment</button><button class="act" onclick="share('${id}')"><b>↗</b>Share</button><button class="act" onclick="openGiftPicker('${uid}','${id}','${t}')"><b>🎁</b>Gift</button><button class="act" onclick="profile('${uid}')"><b>●</b>Profile</button></div></article>`}
function setFeed(x){S.feed=x;document.getElementById("followingTab")?.classList.toggle("on",x==="following");document.getElementById("forYouTab")?.classList.toggle("on",x==="foryou");renderFeed()}
async function like(id,t){if(!needUser())return;const tab=t==="video"?"video_likes":"post_likes",p=t==="video"?{video_id:id,user_id:S.user.id}:{post_id:id,user_id:S.user.id};const r=await sb.from(tab).upsert(p);toast(r.error?r.error.message:"Liked")}
async function follow(id){if(!needUser()||!id)return;const r=await sb.from("follows").upsert({follower_id:S.user.id,following_id:id},{onConflict:"follower_id,following_id"});toast(r.error?r.error.message:"Following")}
function comment(id,t){if(!needUser())return;modal(`<h2>Comment</h2><p class="muted">Join the conversation.</p><textarea id="ct" class="area" placeholder="Write a comment"></textarea><button class="primary" style="width:100%" onclick="saveComment('${esc(id)}','${esc(t)}')">Post</button>`)}
async function saveComment(id,t){const x=document.getElementById("ct").value.trim();if(!x)return;const r=await sb.from(t==="video"?"video_comments":"post_comments").insert(t==="video"?{video_id:id,user_id:S.user.id,content:x}:{post_id:id,user_id:S.user.id,content:x});if(r.error)toast(r.error.message);else{closeModal();toast("Comment posted");await feed();renderFeed()}}
function share(id){navigator.clipboard?.writeText(location.href+"#vybe-"+id);toast("VYBE link copied")}
async function profile(id){if(!id){go("profile");return}const r=await sb.from("profiles").select("*").eq("id",id).maybeSingle();if(!r.data){go("profile");return}modal(`<div>${av(r.data,true)}<h2 style="margin-top:9px">${esc(r.data.display_name||r.data.username)}</h2><p class="muted">@${esc(r.data.username)}</p><p style="margin-top:8px">${esc(r.data.bio||"Building my VYBE.")}</p><button class="primary" onclick="follow('${esc(id)}')">Follow</button></div>`)}
function go(p){S.page=p;if(p==="home"){document.getElementById("home").style.display="block";document.getElementById("root").innerHTML="";document.getElementById("homeNav")?.classList.add("on");renderFeed();return}document.getElementById("home").style.display="none";document.getElementById("homeNav")?.classList.remove("on");renderPage(p)}
function render(){if(S.page==="home"){document.getElementById("home").style.display="block";renderFeed()}else{document.getElementById("home").style.display="none";renderPage(S.page)}}
window.showPage=go;
window.go=go;
window.setFeed=setFeed;
window.openCreate=openCreate;
window.startLive=startLive;
window.auth=auth;
window.profile=profile;
window.follow=follow;
window.like=like;
window.comment=comment;
window.share=share;
function renderPage(p){let h="";if(p==="profile")h=profilePage();else if(p==="wallet")h=walletPage();else if(p==="creator")h=creatorPage();else if(p==="live")h=livePage();else if(p==="discover")h=discoverPage();else if(p==="founder")h=founderPage();else if(p==="settings")h=settingsPage();else h=generic(p);document.getElementById("root").innerHTML=h}
function generic(p){const n=p[0].toUpperCase()+p.slice(1);return `<section class="page show"><div class="hero"><span class="pill">VYBE</span><h1>${esc(n)} <span class="grad">is here.</span></h1><p class="muted">Explore creators, communities, gaming, music, events, jobs, local VYBEs and more.</p></div></section>`}
function profilePage(){if(!S.user)return `<section class="page show"><div class="hero"><h1>Build your <span class="grad">VYBE identity.</span></h1><button class="primary" onclick="auth('login')">Log in</button></div></section>`;const p=S.p||{};return `<section class="page show"><div class="box ${S.founder?"founder":""}" style="padding:0;overflow:hidden"><div class="profilecover" style="${p.cover_url?`background-image:url(${esc(p.cover_url)})`:""}"></div><div class="profilebody"><div class="row between">${av(p,true)}<div class="row wrap"><button class="secondary" onclick="editProfile()">Edit</button><button class="secondary" onclick="asset('avatar')">Photo</button><button class="secondary" onclick="window.openVYBEProfileCosmetics?window.openVYBEProfileCosmetics():toast('Profile Studio is loading')">Style</button></div></div><h2 style="margin-top:9px">${esc(p.display_name||"VYBE Member")}</h2><div class="muted">@${esc(p.username||"member")}</div>${S.founder?'<div class="pill" style="margin-top:7px">👑 VYBE Founder & Owner</div>':""}<p style="margin-top:8px">${esc(p.bio||"Your world. Your people. Your story.")}</p><div class="kpi" style="margin-top:13px"><div><b>${Number(p.followers_count||0)}</b><small>Followers</small></div><div><b>${Number(p.following_count||0)}</b><small>Following</small></div><div><b>${Number(p.likes_count||0)}</b><small>Likes</small></div></div></div></div><div class="grid"><button class="tile" onclick="go('creator')"><b>Creator Hub</b><small>LIVE, gifts and earnings.</small></button><button class="tile" onclick="go('wallet')"><b>Wallet</b><small>${S.coins.toLocaleString()} Coins</small></button>${S.founder?'<button class="tile" onclick="go(\'founder\')"><b>👑 Founder Dashboard</b><small>Owner controls and rewards.</small></button>':""}<button class="tile" onclick="go('settings')"><b>Settings</b><small>Privacy and security.</small></button></div></section>`}
function walletPage(){setTimeout(packages,0);return `<section class="page show"><div class="hero"><h1>Your <span class="grad">Wallet.</span></h1><p class="muted">Spend Coins on Gifts. Creator earnings are separate and cashable under VYBE payout rules.</p></div><div class="kpi"><div><b>${S.coins.toLocaleString()}</b><small>Coins</small></div><div><b>${money(S.earn)}</b><small>Available</small></div><div><b>${money(S.pending)}</b><small>Pending</small></div></div><div class="box"><h3>Buy VYBE Coins</h3><div id="packages" class="grid" style="margin-top:10px"></div></div><div class="box"><h3>Creator payout</h3><p class="muted">Minimum R100. 7-day hold. PayPal account verification and VYBE payout approval are required for real transfers.</p><button class="primary" onclick="payout()">Withdraw</button></div></section>`}
async function packages(){const b=document.getElementById("packages");if(!b||!sb)return;const r=await sb.from("coin_packages").select("*").eq("is_active",true).order("price_zar");if(r.error){b.innerHTML=`<div class="muted">${esc(r.error.message)}</div>`;return}b.innerHTML=(r.data||[]).map(x=>`<button class="tile" onclick="buyCoins('${esc(x.id)}')"><b>${Number(x.coins).toLocaleString()} Coins</b><small>${money(x.price_zar)} • ${esc(x.name)}</small></button>`).join("")}
async function buyCoins(id){if(!needUser())return;const r=await sb.functions.invoke("paypal-create-order",{body:{productType:"coin_package",productId:id,currency:"ZAR"}});if(r.error||r.data?.error){toast(r.data?.error||r.error?.message||"PayPal is not configured");return}if(r.data?.approvalUrl)location.href=r.data.approvalUrl}
async function paypalReturn(){const q=new URLSearchParams(location.search),token=q.get("token");if(!token||!S.user)return;history.replaceState({},document.title,location.pathname);const r=await sb.functions.invoke("paypal-capture-order",{body:{orderId:token}});toast(r.error||r.data?.error?"Payment confirmation failed":"Payment completed");await wallet()}
function creatorPage(){return `<section class="page show"><div class="hero"><span class="pill">CREATOR HUB</span><h1>Create. Go <span class="grad">LIVE.</span> Earn.</h1><p class="muted">Everything for your creator journey in one place.</p><button class="primary" onclick="startLive()">🔴 Start LIVE</button></div><div class="grid"><button class="tile" onclick="openGiftPicker()"><b>🎁 Gift catalogue</b><small>${S.gifts.length||43}+ VYBE Gifts with animation choices.</small></button><button class="tile" onclick="openCreate()"><b>🎬 Create</b><small>Post content to your feed.</small></button><button class="tile" onclick="payout()"><b>💰 Earnings</b><small>${money(S.earn)} available.</small></button><button class="tile" onclick="toast('Analytics opened')"><b>📈 Analytics</b><small>Views, engagement and creator activity.</small></button></div></section>`}
function livePage(){return `<section class="page show"><div class="hero"><span class="pill">VYBE LIVE</span><h1>Go live. <span class="grad">Be seen.</span></h1><p class="muted">Camera, microphone, comments, guests and Gifts.</p><button class="primary" onclick="startLive()">🔴 Start LIVE</button></div></section>`}
function openSearch(){modal(`<h2>Search VYBE</h2><div class="form"><input id="quickSearch" class="field" placeholder="Search creators, videos or posts" autofocus><button class="primary" onclick="searchQuick()">Search</button></div><div id="quickResults"></div>`);setTimeout(()=>document.getElementById("quickSearch")?.focus(),50)}
async function searchQuick(){const q=document.getElementById("quickSearch")?.value.trim();if(!q)return toast("Type something to search");closeModal();go("discover");setTimeout(()=>{const el=document.getElementById("search");if(el){el.value=q;search()}},50)}
function openLiveDirectory(){go("live")}
function discoverPage(){return `<section class="page show"><div class="box"><div class="row"><input id="search" class="field" placeholder="Search VYBE"><button class="primary" style="margin:0" onclick="search()">Search</button></div></div><div id="results"></div></section>`}
async function search(){const q=document.getElementById("search").value.trim();if(!q)return;const r=await sb.from("profiles").select("id,username,display_name,bio,avatar_url").or("username.ilike.%"+q+"%,display_name.ilike.%"+q+"%").limit(15);const rows=(r.data||[]).map(x=>`<div class="item"><div class="row">${av(x)}<div><b>${esc(x.display_name||x.username)}</b><div class="muted">@${esc(x.username)}</div></div></div><button class="secondary" onclick="profile('${esc(x.id)}')">View</button></div>`).join("");document.getElementById("results").innerHTML=`<div class="box"><h3>People</h3>${rows||'<p class="muted">No results.</p>'}</div>`}
async function openFounderReward(){if(!S.founder)return toast("Owner access only");const r=await sb.from("profiles").select("id,username,display_name,avatar_url").eq("age_group","adult").eq("is_vybe_owner",false).order("display_name").limit(50);if(r.error)return toast(r.error.message);const rows=(r.data||[]).map(x=>`<button class="item" onclick="chooseFounderCreator('${esc(x.id)}')"><span class="row">${av(x)}<span><b>${esc(x.display_name||x.username)}</b><small class="muted">@${esc(x.username||"")}</small></span></span><b>Gift →</b></button>`).join("");modal(`<h2>Reward a VYBE Creator</h2><p class="muted">Founder-funded Gifts use your promotional owner balance and create creator earnings.</p><div class="list">${rows||'<p class="muted">No eligible adult creators found yet.</p>'}</div>`)}
function chooseFounderCreator(id){closeModal();openGiftPicker(id,null)}
function founderPage(){if(!S.founder)return generic("Founder");return `<section class="page show"><div class="hero founder"><span class="pill">👑 VYBE FOUNDER & OWNER</span><h1>VYBE <span class="grad">Control Room.</span></h1><p class="muted">Owner-only tools and platform overview.</p></div><div class="kpi"><div><b>15,000,000</b><small>Founder promotional coins</small></div><div><b>${S.gifts.length}</b><small>Active gifts</small></div><div><b>${money(S.earn)}</b><small>Your earnings</small></div></div><div class="grid"><button class="tile" onclick="openFounderReward()"><b>🎁 Reward creators</b><small>Send founder-funded Gifts to eligible adult creators.</small></button><button class="tile" onclick="toast('Platform analytics opened')"><b>📊 Analytics</b><small>Revenue, LIVE and creator metrics.</small></button><button class="tile" onclick="toast('Safety console opened')"><b>🛡 Safety</b><small>Reports and moderation.</small></button><button class="tile" onclick="toast('Feature controls opened')"><b>⚙ Features</b><small>Platform feature controls.</small></button></div></section>`}
function settingsPage(){const items=["Account","Privacy","Notifications","Safety","Messages","Creator & Business","Appearance","Data & Storage","About VYBE"];return `<section class="page show"><div class="hero"><h1>Settings & <span class="grad">Privacy.</span></h1><p class="muted">Account, security, privacy, content, notifications and creator settings.</p></div><div class="list">${items.map(x=>`<button class="item" onclick="toast('${esc(x)} opened')"><span>${esc(x)}</span><b>›</b></button>`).join("")}</div><button class="danger" style="width:100%;margin-top:12px" onclick="signout()">Sign out</button></section>`}
function openCreate(){if(!needUser())return;modal(`<h2>Create a VYBE</h2><p class="muted">Post text or media. Media uses Supabase Storage.</p><div class="form"><textarea id="post" class="area" placeholder="What is your VYBE?"></textarea><input id="file" class="field" type="file" accept="image/*,video/*"><button class="primary" onclick="publish()">Post VYBE</button><button class="secondary" onclick="startLive()">🔴 Start LIVE</button></div>`)}
async function publish(){
 const text=document.getElementById("post")?.value.trim()||"",f=document.getElementById("file")?.files?.[0];
 if(!text&&!f)return toast("Add a caption or media");
 try{
  if(f && f.type.startsWith("video/")){
   const path=S.user.id+"/"+Date.now()+"-"+f.name.replace(/[^a-zA-Z0-9._-]/g,"");
   const u=await sb.storage.from("videos").upload(path,f,{upsert:false,contentType:f.type});
   if(u.error)throw u.error;
   const url=sb.storage.from("videos").getPublicUrl(path).data.publicUrl;
   const r=await sb.from("videos").insert({user_id:S.user.id,video_url:url,caption:text,visibility:"public"});
   if(r.error)throw r.error;
  }else{
   let image_url=null;
   if(f){
    const path=S.user.id+"/post-"+Date.now()+"-"+f.name.replace(/[^a-zA-Z0-9._-]/g,"");
    const u=await sb.storage.from("profile-media").upload(path,f,{upsert:false,contentType:f.type});
    if(u.error)throw u.error;
    image_url=sb.storage.from("profile-media").getPublicUrl(path).data.publicUrl;
   }
   const r=await sb.from("posts").insert({user_id:S.user.id,content:text,image_url});
   if(r.error)throw r.error;
  }
  closeModal();await feed();renderFeed();toast("VYBE posted 🎉");
 }catch(e){toast(e.message||"Could not publish your VYBE")}
}
async function startLive(){
 if(!needUser())return;
 try{
  const a=await sb.rpc("get_my_active_live");
  if(a.error)throw a.error;
  const old=Array.isArray(a.data)?a.data[0]:a.data;
  if(old?.stream_id){S.live={active:true,streamId:old.stream_id,id:old.stream_id,hostId:old.host_id,userId:old.host_id,title:old.title,category:old.description||"Creator",host_id:old.host_id};openRoom(S.live);return}
  modal(`<h2>Start VYBE LIVE</h2><p class="muted">Your camera and microphone will start after LIVE is created.</p><div class="form"><input id="lt" class="field" placeholder="LIVE title"><select id="lc" class="field"><option>Gaming</option><option>Just Chatting</option><option>Music</option><option>Creator</option><option>Business</option></select><button class="primary" onclick="confirmLive()">🔴 Go LIVE</button></div>`)
 }catch(e){toast(e.message||"Could not check LIVE status")}
}
async function confirmLive(){
 const title=document.getElementById("lt")?.value.trim()||"VYBE LIVE",cat=document.getElementById("lc")?.value||"Creator";
 try{
  const r=await sb.rpc("create_vybe_live",{p_title:title,p_description:cat,p_age_restricted:false});
  if(r.error)throw r.error;
  const x=Array.isArray(r.data)?r.data[0]:r.data;if(!x?.stream_id)throw new Error("LIVE was not created");
  S.live={active:true,streamId:x.stream_id,id:x.stream_id,hostId:x.host_id||S.user.id,userId:x.host_id||S.user.id,title,category:cat,host_id:x.host_id||S.user.id};
  localStorage.setItem("vybe_live",JSON.stringify(S.live));closeModal();openRoom(S.live);
 }catch(e){toast(e.message||"Could not start LIVE")}
}
async function openRoom(x){
 S.live={...x,active:true,streamId:x.streamId||x.stream_id||x.id,id:x.streamId||x.stream_id||x.id,hostId:x.hostId||x.host_id||x.userId,userId:x.userId||x.hostId||x.host_id||S.user?.id};
 localStorage.setItem("vybe_live",JSON.stringify(S.live));
 window.dispatchEvent(new Event("vybe-live-started"));
 if(typeof window.vybeOpenLiveRoom==="function"){
  try{window.vybeOpenLiveRoom();return}catch(e){console.warn("VYBE core LIVE",e)}
 }
 const room=document.getElementById("room");if(!room)return;
 room.classList.add("show");document.getElementById("roomTitle").textContent=S.live.title||"VYBE LIVE";document.getElementById("roomVideo").innerHTML='<div class="muted">Starting camera…</div>';
 try{S.camera=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:true});document.getElementById("roomVideo").innerHTML='<video id="cam" autoplay playsinline muted></video>';document.getElementById("cam").srcObject=S.camera}catch(e){document.getElementById("roomVideo").innerHTML='<div style="text-align:center;padding:20px"><h2>Camera permission needed</h2><p class="muted">Allow camera and microphone, then reopen LIVE.</p></div>'}
 bindLive(S.live.id);
}

function bindLive(id){if(!id||!sb)return;if(window.lch)try{sb.removeChannel(window.lch)}catch(e){}window.lch=sb.channel("live-"+id).on("postgres_changes",{event:"INSERT",schema:"public",table:"vybe_live_comments",filter:"stream_id=eq."+id},p=>addComment("Viewer",p.new?.body||"")).subscribe()}
function addComment(n,t){const b=document.getElementById("comments");if(!b)return;const d=document.createElement("div");d.className="comment";d.textContent="@"+n+" "+t;b.appendChild(d);while(b.children.length>8)b.firstChild.remove()}
async function sendComment(){if(!needUser())return;const t=document.getElementById("commentInput")?.value.trim(),id=S.live?.stream_id||S.live?.streamId||S.live?.id;if(!t||!id)return;const r=await sb.rpc("send_vybe_live_comment",{p_stream_id:id,p_body:t});if(r.error)return toast(r.error.message);document.getElementById("commentInput").value="";addComment(S.p?.username||"You",t)}
function toggleMic(){S.mic=!S.mic;(S.camera?.getAudioTracks()||[]).forEach(x=>x.enabled=S.mic);toast(S.mic?"Microphone ON":"Microphone OFF")}
async function flipCamera(){if(!S.camera)return;S.camera.getTracks().forEach(x=>x.stop());const old=document.getElementById("cam")?.srcObject?.getVideoTracks()[0]?.getSettings().facingMode,face=old==="environment"?"user":"environment";try{S.camera=await navigator.mediaDevices.getUserMedia({video:{facingMode:face},audio:S.mic});document.getElementById("cam").srcObject=S.camera}catch(e){toast("Could not flip camera")}}
function liveSettings(){modal(`<h2>LIVE settings</h2><div class="list"><button class="item" onclick="toggleMic();closeModal()">Microphone</button><button class="item" onclick="openGiftPicker();closeModal()">Gifts</button><button class="item" onclick="endLive()">End LIVE</button></div>`)}
async function endLive(){const id=S.live?.stream_id||S.live?.streamId||S.live?.id;try{if(id){const r=await sb.rpc("end_vybe_live",{p_stream_id:id});if(r.error)throw r.error}}catch(e){return toast(e.message||"Could not end LIVE")}closeModal();closeRoom();S.live=null;localStorage.removeItem("vybe_live");toast("LIVE ended") }
function closeRoom(){S.camera?.getTracks().forEach(x=>x.stop());S.camera=null;document.getElementById("room")?.classList.remove("show");if(window.vybeCloseRoom)try{window.vybeCloseRoom()}catch(e){}}
function openGiftPicker(receiver=null,mediaId=null,mediaType="live"){if(!needUser())return;if(!S.gifts.length)return gifts().then(()=>openGiftPicker(receiver,mediaId,mediaType));const target=receiver||S.live?.host_id||S.live?.hostId;if(!target)return toast("Choose a creator or open a LIVE first");modal(`<h2>VYBE Gifts</h2><p class="muted">Gifts from 100 Coins offer three animation choices.</p><div class="giftgrid">${S.gifts.map(g=>`<button class="gift" onclick="chooseGift('${esc(g.id)}','${esc(g.name)}',${Number(g.coin_cost)},'${esc(target)}','${esc(mediaId||"")}','${esc(mediaType||"live")}')"><span class="e">${esc(g.icon||g.emoji||"🎁")}</span><b>${esc(g.name)}</b><small>${Number(g.coin_cost).toLocaleString()} Coins</small></button>`).join("")}</div>`)}
function chooseGift(id,name,cost,target,mediaId,mediaType){const g=S.gifts.find(x=>x.id===id),v=Array.isArray(g?.animation_variants)?g.animation_variants:[];if(cost>=100&&v.length){modal(`<h2>${esc(name)}</h2><p class="muted">${Number(cost).toLocaleString()} Coins</p><div class="variantgrid">${v.slice(0,3).map((x,i)=>`<button class="variant" onclick="sendGift('${esc(id)}','${esc(target)}','${esc(mediaId||"")}','${esc(mediaType||"live")}',${i+1})"><span class="e">${esc(g.icon||"🎁")}</span><b>${esc(x.name||"Animation "+(i+1))}</b></button>`).join("")}</div>`)}else sendGift(id,target,mediaId,mediaType,1)}
async function sendGift(gid,target,mediaId,mediaType,variant){const live=S.live?.stream_id||S.live?.streamId||null,r=await sb.rpc("send_vybe_gift",{p_gift_id:gid,p_receiver_id:target,p_quantity:1,p_video_id:mediaType==="video"?(mediaId||null):null,p_post_id:mediaType==="post"?(mediaId||null):null,p_animation_variant:String(variant),p_live_stream_id:live});if(r.error)return toast(r.error.message);closeModal();await wallet();toast("🎁 Gift sent");if(window.playVYBEGiftAnimation)try{const g=S.gifts.find(x=>x.id===gid);window.playVYBEGiftAnimation({gift_name:g?.name||"VYBE Gift",animation_variant:String(variant),icon:g?.icon||"🎁"})}catch(e){}}
function payout(){if(!needUser())return;modal(`<h2>Creator payout</h2><p class="muted">Available ${money(S.earn)}. Minimum R100.</p><div class="form"><input id="pe" class="field" type="email" placeholder="PayPal email"><input id="pa" class="field" type="number" min="100" placeholder="Amount in ZAR"><button class="primary" onclick="requestPayout()">Save PayPal & Request payout</button></div>`)}
async function requestPayout(){const e=document.getElementById("pe").value.trim(),a=Number(document.getElementById("pa").value);if(!e||a<100)return toast("Enter a PayPal email and at least R100");const s=await sb.rpc("save_creator_paypal_account",{p_paypal_email:e});if(s.error)return toast(s.error.message);const r=await sb.rpc("request_creator_payout",{p_amount:a,p_currency:"ZAR"});if(r.error)return toast(r.error.message);closeModal();await wallet();toast("Payout request created")}
function editProfile(){if(!needUser())return;modal(`<h2>Edit profile</h2><div class="form"><input id="en" class="field" value="${esc(S.p?.display_name||"")}" placeholder="Display name"><input id="eu" class="field" value="${esc(S.p?.username||"")}" placeholder="Username"><textarea id="eb" class="area" placeholder="Bio">${esc(S.p?.bio||"")}</textarea><button class="primary" onclick="saveProfile()">Save</button></div>`)}
async function saveProfile(){const display_name=document.getElementById("en").value.trim(),username=document.getElementById("eu").value.trim().toLowerCase().replace(/[^a-z0-9_]/g,""),bio=document.getElementById("eb").value.trim(),r=await sb.from("profiles").update({display_name,username,bio,updated_at:new Date().toISOString()}).eq("id",S.user.id);if(r.error)return toast(r.error.message);S.p={...S.p,display_name,username,bio};closeModal();renderPage("profile");toast("Profile saved")}
function asset(kind){if(!needUser())return;const b=kind==="avatar"?"avatars":"covers";modal(`<h2>Upload ${esc(kind)}</h2><input id="asset" class="field" type="file" accept="image/*"><button class="primary" onclick="saveAsset('${b}','${kind}')">Upload</button>`)}
async function saveAsset(bucket,kind){const f=document.getElementById("asset").files[0];if(!f)return;const path=S.user.id+"/"+kind+"-"+Date.now();const u=await sb.storage.from(bucket).upload(path,f,{upsert:false,contentType:f.type});if(u.error)return toast("Storage bucket/policy needed: "+u.error.message);const url=sb.storage.from(bucket).getPublicUrl(path).data.publicUrl,r=await sb.from("profiles").update(kind==="avatar"?{avatar_url:url}:{cover_url:url}).eq("id",S.user.id);if(r.error)return toast(r.error.message);S.p={...S.p,...(kind==="avatar"?{avatar_url:url}:{cover_url:url})};closeModal();renderPage("profile")}
function auth(mode){modal(`<h2>${mode==="login"?"Welcome back":"Create your VYBE"}</h2><div class="form">${mode==="signup"?'<input id="an" class="field" placeholder="Display name"><input id="au" class="field" placeholder="Username"><input id="ad" class="field" type="date">':''}<input id="ae" class="field" type="email" placeholder="Email"><input id="ap" class="field" type="password" placeholder="Password"><button class="primary" onclick="submitAuth('${mode}')">${mode==="login"?"Log in":"Create account"}</button><button class="secondary" onclick="auth('${mode==="login"?"signup":"login"}')">${mode==="login"?"Create account":"Log in instead"}</button></div><p id="am" class="muted" style="margin-top:8px"></p>`)}
function age(d){const x=new Date(d),n=new Date();let a=n.getFullYear()-x.getFullYear();if(n.getMonth()<x.getMonth()||(n.getMonth()===x.getMonth()&&n.getDate()<x.getDate()))a--;return a}
async function submitAuth(mode){const e=document.getElementById("ae").value.trim(),p=document.getElementById("ap").value,m=document.getElementById("am");try{if(mode==="login"){const r=await sb.auth.signInWithPassword({email:e,password:p});if(r.error)throw r.error;closeModal();await load();return}const n=document.getElementById("an").value.trim(),u=document.getElementById("au").value.trim().toLowerCase().replace(/[^a-z0-9_]/g,""),d=document.getElementById("ad").value,a=age(d);if(!n||!u||!d||a<13){m.textContent="VYBE requires age 13+.";return}const group=a>=18?"adult":"under_18",r=await sb.auth.signUp({email:e,password:p,options:{data:{display_name:n,username:u,date_of_birth:d,age_group:group}}});if(r.error)throw r.error;if(r.data.user)await sb.from("profiles").upsert({id:r.data.user.id,username:u,display_name:n,date_of_birth:d,age_group:group,bio:""},{onConflict:"id"});m.textContent="Account created. Check your email if confirmation is enabled."}catch(x){m.textContent=x.message||"Unable to connect to VYBE."}}
async function signout(){await sb.auth.signOut();S.user=null;S.p=null;S.founder=false;go("home");toast("Signed out")}
async function boot(){try{await load();if(sb)await paypalReturn()}catch(e){console.error("VYBE boot error",e);renderFeed();toast("VYBE loaded in offline mode. Refresh to reconnect.")}}
if(sb)sb.auth.onAuthStateChange(()=>setTimeout(load,0));
window.openModal=modal;window.closeModal=closeModal;window.openAuthModal=auth;window.openSearch=openSearch;window.openLiveDirectory=openLiveDirectory;window.closeRoom=closeRoom;window.toggleMic=toggleMic;window.flipCamera=flipCamera;window.liveSettings=liveSettings;window.sendComment=sendComment;window.openGiftPicker=openGiftPicker;
renderFeed();
boot();
</script>
</body>
</html>
