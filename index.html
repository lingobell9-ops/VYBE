async function runSearch(q){q=q.trim();if(!q){toast('Type something to search');return}showPage('discover');const box=document.getElementById('searchResults');if(box)box.innerHTML='<div class="card"><p class="muted">Searching VYBE…</p></div>';const term=q.toLowerCase();let html='';try{const [people,listings,jobs]=await Promise.all([sb.from('profiles').select('id,username,display_name,bio,avatar_url').ilike('username',`%${term}%`).limit(10),sb.from('listings').select('id,title,price,currency,location_text,seller_id').eq('status','active').ilike('title',`%${term}%`).limit(10),sb.from('jobs').select('id,title,company,location_text,remote,salary_text,employer_id').eq('status','active').ilike('title',`%${term}%`).limit(10)]);if(people.data?.length)html+=`<div class="card"><h3>People</h3><div class="list">${people.data.map(x=>`<div class="list-item"><div><b>${esc(x.display_name||x.username)}</b><p>@${esc(x.username)}</p></div><button class="secondary" onclick="showPage('profile')">View</button></div>`).join('')}</div></div>`;if(listings.data?.length)html+=`<div class="card"><h3>Store</h3><div class="list">${listings.data.map(x=>`<div class="list-item"><div><b>${esc(x.title)}</b><p>${esc(x.location_text||'VYBE Store')}</p></div><span class="price">${esc(x.currency||'ZAR')} ${x.price??'Contact'}</span></div>`).join('')}</div></div>`;if(jobs.data?.length)html+=`<div class="card"><h3>Jobs</h3><div class="list">${jobs.data.map(x=>`<div class="list-item"><div><b>${esc(x.title)}</b><p>${esc(x.company||'VYBE employer')} · ${x.remote?'Remote':esc(x.location_text||'Location not specified')}</p></div><span class="price">Apply</span></div>`).join('')}</div></div>`}catch(e){html=`<div class="card"><p class="muted">Search could not reach the VYBE database. Check the Supabase setup.</p></div>`}if(!html)html='<div class="card"><p class="muted">No matching VYBE results were found.</p></div>';if(box)box.innerHTML=html;toast('Search complete')}
function openSearch(){openModal(`<h2>Search VYBE</h2><p class="modal-sub">People, VYBEs, LIVE, businesses, places, music, games, events, jobs and more.</p><div class="search"><input id="globalSearch" class="field" placeholder="Search VYBE"><button class="primary" style="margin:0" onclick="runSearch(document.getElementById('globalSearch').value)">Search</button></div><div class="chips"><span class="chip">People</span><span class="chip">VYBEs</span><span class="chip">LIVE</span><span class="chip">Business</span><span class="chip">Places</span><span class="chip">Music</span><span class="chip">Gaming</span><span class="chip">Jobs</span></div>`)}
async function openSetting(name){if(name==='Ghost'){toggleGhost();return}if(!state.user){openAuthModal('login');return}const groups={Account:['Login alerts','Two-step verification','Session management'],Notifications:['Likes and comments','Follows and mentions','LIVE and gifts','Messages','Challenges and events'],Privacy:['Private account','Who can message me','Who can comment','Show liked VYBEs','Show activity status'],Safety:['Blocked accounts','Sensitive content controls','Report history','Appeal centre'],Content:['Autoplay','Downloads','Data Saver','Content preferences'],Messages:['Message requests','Read receipts','Online status','Group messages'],Location:['Location posts','VYBE Local discoverability','Nearby features'],'Creator & Business':['Creator analytics','Business profile','Promotions','Business subscriptions'],Appearance:['Dark mode','Profile animations','Accessibility'],'Data & Storage':['Clear cache','Media upload quality','Storage usage'],'About VYBE':['Community Guidelines','Privacy Policy','Terms of Service','App version']};const items=groups[name]||['Account preference'];openModal(`<h2>${esc(name)}</h2><p class="modal-sub">Changes are saved to your VYBE account settings.</p><div class="feature-list">${items.map((x,i)=>`<div class="feature"><div><b>${esc(x)}</b><small>${esc(settingDescription(x))}</small></div><button id="setting_${i}" class="switch" onclick="toggleSettingValue('${esc(name)}','${esc(x)}',this)"><i></i></button></div>`).join('')}</div>`);loadSettingValues(name,items)}
function settingDescription(x){const map={'Private account':'Only approved followers can see your profile content.','Show activity status':'Controls whether others can see when you are active.','Data Saver':'Reduces media data usage on supported content.','Online status':'Controls your visible online indicator.','Two-step verification':'Adds an extra sign-in security step when supported.','Clear cache':'Removes temporary local VYBE files from this device.'};return map[x]||'VYBE account setting.'}
async function loadSettingValues(group,items){try{const {data}=await sb.from('user_settings').select('*').eq('user_id',state.user.id).maybeSingle();const col=group.toLowerCase().replace(/[^a-z]/g,'_');const obj=data?.[col]||{};items.forEach((x,i)=>{if(obj[x]===true)document.getElementById('setting_'+i)?.classList.add('on')})}catch(e){}}
async function toggleSettingValue(group,key,el){el.classList.toggle('on');const col=group.toLowerCase().replace(/[^a-z]/g,'_');try{const {data}=await sb.from('user_settings').select('*').eq('user_id',state.user.id).maybeSingle();const current=data?.[col]||{};current[key]=el.classList.contains('on');const payload={user_id:state.user.id,updated_at:new Date().toISOString()};payload[col]=current;const {error}=await sb.from('user_settings').upsert(payload,{onConflict:'user_id'});if(error)throw error;toast(`${key} ${current[key]?'ON':'OFF'}`)}catch(e){el.classList.toggle('on');toast('Could not save this setting. Check the Supabase setup.')}}
function toggleGhost(){state.ghost=!state.ghost;localStorage.setItem('vybe_ghost',state.ghost?'1':'0');toast(state.ghost?'Ghost mode ON':'Ghost mode OFF');render()}
function openProfileEditor(){if(!state.user){openAuthModal('login');return}const p=state.profile||{};openModal(`<h2>Edit Profile</h2><p class="modal-sub">TikTok-style profile shell with deeper VYBE customization.</p><div class="form-grid"><label><span class="form-label">Display name</span><input id="editName" class="field" value="${esc(p.display_name||'')}"></label><label><span class="form-label">Username</span><input id="editUsername" class="field" value="${esc(p.username||'')}"></label><label><span class="form-label">Bio</span><textarea id="editBio" class="field" rows="4">${esc(p.bio||'')}</textarea></label><label><span class="form-label">Profile headline</span><input id="editHeadline" class="field" value="${esc(p.headline||'')}"></label></div><div class="modal-actions"><button class="primary" onclick="saveProfile()">Save profile</button><button class="secondary" onclick="openAvatarUpload()">Change profile picture</button><button class="secondary" onclick="openCoverUpload()">Change cover</button><button class="secondary" onclick="openProfileDetails()">More about me</button></div><div id="profileMsg" class="message"></div>`)}
async function saveProfile(){const name=document.getElementById('editName').value.trim();const username=document.getElementById('editUsername').value.trim().toLowerCase().replace(/[^a-z0-9_]/g,'');const bio=document.getElementById('editBio').value.trim();const headline=document.getElementById('editHeadline').value.trim();if(!name||!username){toast('Display name and username are required.');return}if(!state.user){toast('Please log in first.');return}try{const {error:aerr}=await sb.auth.updateUser({data:{display_name:name,username,bio,headline}});if(aerr)throw aerr;const {error}=await sb.from('profiles').upsert({id:state.user.id,username,display_name:name,bio,headline},{onConflict:'id'});if(error)console.warn('Profile update:',error.message);state.profile={...(state.profile||{}),display_name:name,username,bio,headline};closeModal();render();toast('Profile updated.')}catch(e){document.getElementById('profileMsg').textContent=e.message;document.getElementById('profileMsg').className='message error';document.getElementById('profileMsg').style.display='block'}}
function openProfileDetails(){const d=state.profile?.profile_details||{};const fields=['Location','Hometown','Work','Education','Hobbies','Interests','Music','Travel','Website'];openModal(`<h2>More about me</h2><p class="modal-sub">Add the information you want displayed on your VYBE profile. Privacy controls can be applied to each section.</p><div class="form-grid">${fields.map(x=>{const k=x.toLowerCase();return `<label><span class="form-label">${x}</span><input id="detail_${k}" class="field" value="${esc(d[k]||'')}" placeholder="Add ${x.toLowerCase()}"></label>`}).join('')}</div><button class="primary" style="width:100%" onclick="saveProfileDetails()">Save details</button><div id="detailsMsg" class="message"></div>`)}
async function saveProfileDetails(){if(!state.user){openAuthModal('login');return}const fields=['Location','Hometown','Work','Education','Hobbies','Interests','Music','Travel','Website'];const details={...(state.profile?.profile_details||{})};fields.forEach(x=>details[x.toLowerCase()]=document.getElementById('detail_'+x.toLowerCase())?.value.trim()||'');try{const {error}=await sb.from('profiles').update({profile_details:details}).eq('id',state.user.id);if(error)throw error;state.profile={...(state.profile||{}),profile_details:details};closeModal();render();toast('Profile details saved')}catch(e){const m=document.getElementById('detailsMsg');if(m){m.textContent=e.message;m.className='message error';m.style.display='block'}}}
function openAvatarUpload(){if(!state.user){openAuthModal('login');return}openModal(`<h2>Profile Picture</h2><p class="modal-sub">Choose an image. VYBE can store it in Supabase Storage once the avatar bucket is configured.</p><input id="avatarFile" class="field" type="file" accept="image/*"><button class="primary" style="width:100%" onclick="uploadAvatar()">Upload</button><div id="uploadMsg" class="message"></div>`)}
async function uploadAvatar(){const f=document.getElementById('avatarFile').files[0];if(!f){toast('Choose an image first.');return}if(f.size>5*1024*1024){toast('Profile images must be 5 MB or smaller.');return}try{const path=state.user.id+'/avatar-'+Date.now();const {error}=await sb.storage.from('avatars').upload(path,f,{upsert:true,contentType:f.type});if(error)throw error;const {data}=sb.storage.from('avatars').getPublicUrl(path);await sb.from('profiles').update({avatar_url:data.publicUrl}).eq('id',state.user.id);state.profile={...(state.profile||{}),avatar_url:data.publicUrl};closeModal();render();toast('Profile picture updated.')}catch(e){document.getElementById('uploadMsg').textContent='Storage setup is required for uploads: '+e.message;document.getElementById('uploadMsg').className='message error';document.getElementById('uploadMsg').style.display='block'}}
function openCoverUpload(){if(!state.user){openAuthModal('login');return}openModal(`<h2>Profile Cover</h2><p class="modal-sub">Choose an image. VYBE can store it in Supabase Storage once the cover bucket is configured.</p><input id="coverFile" class="field" type="file" accept="image/*"><button class="primary" style="width:100%" onclick="uploadCover()">Upload</button><div id="uploadMsg" class="message"></div>`)}
async function uploadCover(){const f=document.getElementById('coverFile').files[0];if(!f){toast('Choose an image first.');return}if(f.size>8*1024*1024){toast('Cover images must be 8 MB or smaller.');return}try{const path=state.user.id+'/cover-'+Date.now();const {error}=await sb.storage.from('covers').upload(path,f,{upsert:true,contentType:f.type});if(error)throw error;const {data}=sb.storage.from('covers').getPublicUrl(path);await sb.from('profiles').update({cover_url:data.publicUrl}).eq('id',state.user.id);state.profile={...(state.profile||{}),cover_url:data.publicUrl};closeModal();render();toast('Profile cover updated.')}catch(e){document.getElementById('uploadMsg').textContent='Storage setup is required for uploads: '+e.message;document.getElementById('uploadMsg').className='message error';document.getElementById('uploadMsg').style.display='block'}}
function createListing(){if(!state.user){openAuthModal('signup');return}openModal(`<h2>VYBE Store Listing</h2><p class="modal-sub">Create a real listing for VYBE Store.</p><div class="form-grid"><input id="listingTitle" class="field" placeholder="Title"><input id="listingPrice" class="field" type="number" min="0" step="0.01" placeholder="Price in ZAR"><select id="listingCategory" class="field"><option>Products</option><option>Services</option><option>Gaming</option><option>Vehicles</option><option>Electronics</option><option>Other</option></select><textarea id="listingDescription" class="field" rows="4" placeholder="Description"></textarea><input id="listingLocation" class="field" placeholder="Location"><input id="listingContact" class="field" placeholder="Contact information"></div><button class="primary" style="width:100%" onclick="saveListing()">Create listing</button><div id="listingMsg" class="message"></div>`)}

function speakTest(){const sel=document.getElementById('voiceSelect');speakText('Welcome to VYBE LIVE',sel?.value||'auto')}
function speakText(text,preferred='auto'){if(!('speechSynthesis' in window)){toast('Voice reading is not supported on this device.');return}const voices=speechSynthesis.getVoices();let v=voices.find(x=>preferred==='female'&&/female|samantha|zira|victoria|susan/i.test(x.name))||voices.find(x=>preferred==='male'&&/male|david|mark|daniel|alex/i.test(x.name))||voices.find(x=>/^en/i.test(x.lang))||voices[0];const u=new SpeechSynthesisUtterance(text);if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u)}
function signOut(){sb.auth.signOut().finally(()=>{state.user=null;state.profile=null;toast('Signed out of VYBE');showPage('home')})}
function openAuthModal(mode='signup'){document.getElementById('modalRoot').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modal-box"><h2>${mode==='login'?'Welcome Back to VYBE':'Create Your VYBE Account'}</h2><p class="modal-sub">Your account is the foundation of your VYBE identity.</p>${mode==='signup'?`<div class="form-grid"><input class="field" id="authName" placeholder="Display name"><input class="field" id="authUsername" placeholder="Username"><input class="field" id="authDob" type="date"></div>`:''}<div class="form-grid" style="margin-top:11px"><input class="field" id="authEmail" type="email" placeholder="Email"><input class="field" id="authPassword" type="password" placeholder="Password"></div><div class="modal-actions"><button class="primary" onclick="submitAuth('${mode}')">${mode==='login'?'Log In':'Create Account'}</button><button class="secondary" onclick="openAuthModal('${mode==='login'?'signup':'login'}')">${mode==='login'?'Create a new account':'Already have an account? Log in'}</button><button class="secondary" onclick="closeModal()">Cancel</button></div><div id="authMsg" class="message"></div></div></div>`}
function ageFromDob(dob){const d=new Date(dob);if(Number.isNaN(d.getTime()))return null;const n=new Date();let a=n.getFullYear()-d.getFullYear();if(n.getMonth()<d.getMonth()||(n.getMonth()===d.getMonth()&&n.getDate()<d.getDate()))a--;return a}
async function submitAuth(mode){const email=document.getElementById('authEmail').value.trim();const password=document.getElementById('authPassword').value;const msg=document.getElementById('authMsg');const fail=t=>{msg.textContent=t;msg.className='message error';msg.style.display='block'};if(!email||!password)return fail('Email and password are required.');if(password.length<6)return fail('Password must be at least 6 characters.');try{if(mode==='login'){const {error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;closeModal();await loadUser();toast('Welcome back to VYBE.');return}const name=document.getElementById('authName').value.trim();const username=document.getElementById('authUsername').value.trim().toLowerCase().replace(/[^a-z0-9_]/g,'');const dob=document.getElementById('authDob').value;const age=ageFromDob(dob);if(!name||!username||!dob)return fail('Please complete your name, username and date of birth.');if(age===null||age<13)return fail('VYBE currently requires members to be 13 or older.');const ageGroup=age>=18?'adult':'teen';const {data,error}=await sb.auth.signUp({email,password,options:{data:{display_name:name,username,bio:'',dob,age_group:ageGroup}}});if(error)throw error;if(data.user){await sb.from('profiles').upsert({id:data.user.id,username,display_name:name,dob,age_group:ageGroup,bio:''},{onConflict:'id'})}msg.className='message';msg.textContent='Account created. If email confirmation is enabled, check your email before logging in.';msg.style.display='block'}catch(e){fail(e.message||'Unable to connect to VYBE.')}}
async function loadUser(){const {data}=await sb.auth.getUser();state.user=data.user||null;if(state.user){const {data:p}=await sb.from('profiles').select('*').eq('id',state.user.id).maybeSingle();state.profile=p||{display_name:state.user.user_metadata?.display_name||'VYBE Member',username:state.user.user_metadata?.username||'member',bio:state.user.user_metadata?.bio||''};state.profileViews=Number(localStorage.getItem('vybe_profile_views')||0)+1;localStorage.setItem('vybe_profile_views',state.profileViews)}render()}
sb.auth.onAuthStateChange(()=>setTimeout(loadUser,0));
buildNav();render();loadUser();
async function saveProfile(){
  const name=document.getElementById('editName')?.value.trim()||'';
  const username=document.getElementById('editUsername')?.value.trim().toLowerCase().replace(/[^a-z0-9_]/g,'')||'';
  const bio=document.getElementById('editBio')?.value.trim()||'';
  const headline=document.getElementById('editHeadline')?.value.trim()||'';

  if(!name||!username){
    toast('Display name and username are required.');
    return;
  }

  if(!state.user){
    toast('Please log in first.');
    return;
  }

  try{
    const {data,error}=await sb.from('profiles')
      .update({
        username:username,
        display_name:name,
        bio:bio,
        headline:headline,
        updated_at:new Date().toISOString()
      })
      .eq('id',state.user.id)
      .select('*')
      .single();

    if(error)throw error;
    if(!data)throw new Error('Profile could not be saved.');

    state.profile=data;
    closeModal();
    render();
    toast('Profile saved successfully.');
  }catch(e){
    toast('Could not save profile: '+(e.message||'Unknown error'));
    console.error(e);
  }
}
async function createPost(){
  if(!state.user){
    openAuthModal('signup');
    return;
  }

  const el=document.getElementById('postText');
  const text=el?.value.trim()||'';

  if(!text){
    toast('Write something first.');
    return;
  }

  try{
    const {data,error}=await sb.from('posts')
      .insert({
        user_id:state.user.id,
        content:text
      })
      .select('*')
      .single();

    if(error)throw error;

    state.posts.unshift({
      id:data.id,
      text:data.content,
      name:state.profile?.display_name||'VYBE Creator',
      username:state.profile?.username||'creator',
      location:'VYBE',
      created_at:data.created_at
    });

    el.value='';
    addXP(10);
    render();
    toast('VYBE posted successfully.');
  }catch(e){
    toast('Could not post VYBE: '+(e.message||'Unknown error'));
  }
}
async function loadSupabasePosts(){
  if(!state.user)return;

  try{
    const {data,error}=await sb.from('posts')
      .select('id,user_id,content,image_url,created_at,updated_at')
      .order('created_at',{ascending:false})
      .limit(50);

    if(error)throw error;

    const rows=data||[];
    const ids=[...new Set(rows.map(x=>x.user_id).filter(Boolean))];
    let profiles=[];

    if(ids.length){
      const result=await sb.from('profiles')
        .select('id,username,display_name,avatar_url')
        .in('id',ids);

      if(result.error)throw result.error;
      profiles=result.data||[];
    }

    const profileMap={};
    profiles.forEach(p=>profileMap[p.id]=p);

    state.posts=rows.map(x=>{
      const p=profileMap[x.user_id]||{};
      return {
        id:x.id,
        text:x.content||'',
        name:p.display_name||'VYBE Creator',
        username:p.username||'creator',
        avatar_url:p.avatar_url||'',
        location:'VYBE',
        created_at:x.created_at
      };
    });

    window._supabaseFeedReady=true;
    render();
  }catch(e){
    console.error(e);
    toast('Could not load VYBE feed.');
  }
}

function renderFeed(){
  if(!window._supabaseFeedReady){
    if(state.user&&!window._supabaseFeedLoading){
      window._supabaseFeedLoading=true;
      loadSupabasePosts();
    }
  }

  const posts=[...state.posts];

  if(!posts.length){
    return `<div class="section-head"><h2>For You</h2></div>
    <div class="card">
      <p class="muted">Your VYBE feed will grow as you follow people, join communities and discover creators.</p>
    </div>`;
  }

  return `<div class="section-head"><h2>For You</h2></div>
  ${posts.map((x,i)=>`
    <article class="feed-item">
      <div class="row">
        ${x.avatar_url
          ? `<div class="avatar"><img src="${esc(x.avatar_url)}" alt="Profile"></div>`
          : `<div class="avatar">${esc(initials(x.name||'V'))}</div>`
        }
        <div>
          <b>${esc(x.name||'VYBE Creator')}</b>
          <div class="muted">@${esc(x.username||'creator')} · ${esc(x.location||'VYBE')}</div>
        </div>
      </div>
      <div class="feed-body">${esc(x.text)}</div>
      <div class="feed-actions">
        <button onclick="likePost(${i})">${state.likes[i]?'Liked':'Like'}</button>
        <button onclick="commentPost()">Comment</button>
        <button onclick="sharePost()">Share</button>
        <button onclick="showPage('wallet')">Gift</button>
      </div>
    </article>
  `).join('')}`;
}
