<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07070b">

<title>VYBE | Your World. Your People. Your Story.</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#07070b;
  --panel:#111118;
  --panel2:#171720;
  --line:#292936;
  --text:#ffffff;
  --muted:#9b9ba8;
  --pink:#ff2bd6;
  --purple:#8b5cff;
  --blue:#25c8ff;
  --green:#39e58c;
  --red:#ff4f6d;
}

html,
body{
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,Arial,sans-serif;
}

body{
  overflow-x:hidden;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
  color:#fff;
  border:0;
}

.app{
  min-height:100vh;
  padding-bottom:84px;
}

.topbar{
  height:64px;
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:50;

  background:rgba(7,7,11,.92);
  backdrop-filter:blur(18px);

  border-bottom:1px solid var(--line);

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 18px;
}

.logo{
  font-weight:1000;
  font-size:28px;
  letter-spacing:2px;

  background:
    linear-gradient(
      90deg,
      var(--pink),
      var(--purple),
      var(--blue)
    );

  -webkit-background-clip:text;
  color:transparent;
}

.top-actions{
  display:flex;
  gap:8px;
}

.icon{
  width:40px;
  height:40px;

  border-radius:12px;

  background:var(--panel2);
  border:1px solid var(--line);
}

.layout{
  display:grid;

  grid-template-columns:
    230px
    minmax(0,760px)
    230px;

  gap:18px;

  max-width:1250px;
  margin:auto;

  padding:
    84px
    18px
    20px;
}

.sidebar,
.rightbar{
  position:sticky;
  top:82px;
  height:max-content;
}

.nav-list{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.nav-item{
  background:transparent;
  border:1px solid transparent;

  border-radius:14px;

  padding:12px;

  text-align:left;

  color:var(--muted);

  display:flex;
  align-items:center;
  gap:11px;
}

.nav-item.active,
.nav-item:hover{
  background:var(--panel);
  border-color:var(--line);
  color:#fff;
}

.nav-icon{
  width:26px;
  text-align:center;
  font-size:19px;
}

.brand-card,
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:20px;
}

.brand-card{
  padding:16px;
  margin-bottom:14px;
}

.brand-card p,
.muted{
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
}

.card{
  padding:18px;
  margin-bottom:14px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.hero{
  padding:28px;

  border-radius:24px;

  min-height:360px;

  background:
    radial-gradient(
      circle at 80% 20%,
      rgba(255,43,214,.28),
      transparent 35%
    ),
    radial-gradient(
      circle at 20% 30%,
      rgba(37,200,255,.2),
      transparent 35%
    ),
    linear-gradient(
      145deg,
      #171021,
      #09090e 70%
    );

  border:1px solid var(--line);

  display:flex;
  flex-direction:column;
  justify-content:flex-end;
}

.hero h1{
  font-size:44px;
  line-height:1.02;
}

.grad{
  background:
    linear-gradient(
      90deg,
      var(--pink),
      var(--purple),
      var(--blue)
    );

  -webkit-background-clip:text;
  color:transparent;
}

.hero p{
  max-width:560px;

  color:#d2d2dc;

  line-height:1.55;

  margin-top:14px;
}

.primary{
  background:
    linear-gradient(
      90deg,
      var(--pink),
      var(--purple)
    );

  padding:13px 18px;

  border-radius:13px;

  font-weight:800;

  margin-top:20px;
}

.secondary{
  background:var(--panel2);

  border:1px solid var(--line);

  padding:11px 14px;

  border-radius:12px;
}

.danger{
  background:rgba(255,79,109,.13);
  color:#ff8298;

  border:1px solid rgba(255,79,109,.3);

  padding:11px 14px;

  border-radius:12px;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;

  margin:18px 0 12px;
}

.section-head h2{
  font-size:22px;
}

.grid{
  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:12px;
}

.tile{
  min-height:150px;

  padding:18px;

  border-radius:18px;

  border:1px solid var(--line);

  background:
    linear-gradient(
      145deg,
      var(--panel2),
      #0d0d12
    );

  display:flex;
  flex-direction:column;
  justify-content:flex-end;
}

.tile strong{
  font-size:18px;
}

.tile span{
  color:var(--muted);
  font-size:13px;
  margin-top:5px;
}

.feed-item{
  padding:18px;

  border-radius:18px;

  background:var(--panel);

  border:1px solid var(--line);

  margin-bottom:12px;
}

.row{
  display:flex;
  align-items:center;
  gap:10px;
}

.between{
  justify-content:space-between;
}

.avatar{
  width:44px;
  height:44px;

  border-radius:50%;

  display:grid;
  place-items:center;

  font-weight:900;

  background:
    linear-gradient(
      135deg,
      var(--pink),
      var(--purple),
      var(--blue)
    );

  flex:none;
}

.feed-body{
  margin:14px 0;
  line-height:1.5;
}

.feed-actions{
  display:flex;
  gap:8px;
}

.feed-actions button{
  background:var(--panel2);

  border:1px solid var(--line);

  padding:9px 11px;

  border-radius:11px;

  color:#ddd;
}

.composer textarea,
.field{
  width:100%;

  background:#09090e;

  color:#fff;

  border:1px solid var(--line);

  border-radius:14px;

  padding:13px;

  outline:none;
}

.composer textarea{
  min-height:105px;
  resize:vertical;
}

.composer textarea:focus,
.field:focus{
  border-color:var(--purple);
}

.composer-actions{
  display:flex;
  justify-content:flex-end;

  margin-top:10px;
}

.profile-cover{
  height:170px;

  border-radius:
    20px
    20px
    0
    0;

  background:
    radial-gradient(
      circle at 75% 30%,
      rgba(255,43,214,.5),
      transparent 32%
    ),
    linear-gradient(
      135deg,
      #181022,
      #0b101b
    );

  border:1px solid var(--line);
}

.profile-main{
  margin-top:-45px;
  padding:0 20px 20px;
}

.big-avatar{
  width:92px;
  height:92px;

  border-radius:50%;

  border:5px solid var(--bg);

  display:grid;
  place-items:center;

  font-size:34px;
  font-weight:900;

  background:
    linear-gradient(
      135deg,
      var(--pink),
      var(--purple),
      var(--blue)
    );
}

.stats{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:8px;

  margin:18px 0;
}

.stat{
  background:var(--panel2);

  border:1px solid var(--line);

  border-radius:14px;

  padding:12px;

  text-align:center;
}

.stat b{
  display:block;
  font-size:19px;
}

.stat span{
  color:var(--muted);
  font-size:11px;
}

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.chip{
  background:var(--panel2);

  border:1px solid var(--line);

  border-radius:999px;

  padding:7px 10px;

  color:#ddd;

  font-size:12px;
}

.feature-list{
  display:grid;
  gap:10px;
}

.feature{
  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:14px;

  border-radius:15px;

  background:var(--panel2);

  border:1px solid var(--line);
}

.feature-left{
  display:flex;
  gap:12px;
  align-items:center;
}

.feature-icon{
  font-size:23px;
  width:30px;
  text-align:center;
}

.feature small{
  display:block;

  color:var(--muted);

  margin-top:3px;
}

.pill{
  font-size:11px;

  padding:5px 8px;

  border-radius:999px;

  background:rgba(139,92,255,.16);

  color:#c9baff;
}

.right-card{
  padding:15px;
  margin-bottom:12px;
}

.right-card h3{
  margin-bottom:10px;
}

.mini{
  display:flex;

  gap:10px;

  padding:9px 0;

  border-bottom:1px solid var(--line);
}

.mini:last-child{
  border-bottom:0;
}

.bottom-nav{
  display:none;
}

.modal{
  position:fixed;
  inset:0;

  z-index:100;

  background:rgba(0,0,0,.86);

  display:flex;
  align-items:center;
  justify-content:center;

  padding:18px;
}

.modal-box{
  width:min(460px,100%);

  max-height:92vh;

  overflow:auto;

  background:#111118;

  border:1px solid var(--line);

  border-radius:22px;

  padding:24px;

  box-shadow:
    0
    30px
    90px
    rgba(0,0,0,.7);
}

.modal h2{
  text-align:center;
}

.modal-sub{
  text-align:center;

  color:var(--muted);

  margin:
    8px
    0
    20px;

  line-height:1.45;
}

.form-grid{
  display:grid;
  gap:11px;
}

.form-label{
  font-size:12px;
  color:#aaa;

  margin-bottom:5px;

  display:block;
}

.modal-actions{
  display:grid;
  gap:9px;
  margin-top:14px;
}

.message{
  display:none;

  padding:11px;

  border-radius:12px;

  background:var(--panel2);

  color:#ddd;

  font-size:13px;

  line-height:1.45;

  margin-top:11px;
}

.error{
  border:
    1px
    solid
    rgba(255,79,109,.35);

  background:
    rgba(255,79,109,.08);
}

.search{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}

.search .field{
  flex:1;
}

.toast{
  position:fixed;

  left:50%;
  bottom:96px;

  transform:translateX(-50%);

  z-index:200;

  background:#1c1c25;

  border:1px solid var(--line);

  padding:12px 16px;

  border-radius:13px;

  display:none;

  max-width:90%;

  text-align:center;
}

.hidden{
  display:none!important;
}

@media(max-width:980px){

  .layout{
    grid-template-columns:
      190px
      minmax(0,1fr);
  }

  .rightbar{
    display:none;
  }

}

@media(max-width:700px){

  .topbar{
    height:60px;
  }

  .layout{
    display:block;

    padding:
      76px
      12px
      12px;
  }

  .sidebar{
    display:none;
  }

  .bottom-nav{
    position:fixed;

    display:grid;

    grid-template-columns:
      repeat(5,1fr);

    bottom:0;
    left:0;
    right:0;

    height:78px;

    z-index:60;

    background:
      rgba(8,8,12,.97);

    border-top:1px solid var(--line);

    padding-bottom:
      env(safe-area-inset-bottom);
  }

  .bottom-nav button{
    background:transparent;

    color:var(--muted);

    font-size:10px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:4px;
  }

  .bottom-nav button.active{
    color:#fff;
  }

  .bottom-nav b{
    font-size:20px;
  }

  .grid{
    grid-template-columns:
      1fr
      1fr;
  }

  .hero{
    min-height:410px;
    padding:22px;
  }

  .hero h1{
    font-size:37px;
  }

  .card{
    padding:15px;
  }

  .app{
    padding-bottom:78px;
  }

}

@media(max-width:430px){

  .grid{
    grid-template-columns:1fr;
  }

  .top-actions .icon:last-child{
    display:none;
  }

  .hero h1{
    font-size:34px;
  }

  .profile-main{
    padding:
      0
      14px
      16px;
  }

  .feed-actions{
    overflow:auto;
  }

  .feed-actions button{
    white-space:nowrap;
  }

}

</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

<div class="app">

<header class="topbar">

  <div class="logo">
    VYBE
  </div>

  <div class="top-actions">

    <button
      class="icon"
      type="button"
      onclick="openSearch()"
    >
      ⌕
    </button>

    <button
      class="icon"
      type="button"
      onclick="showPage('notifications')"
    >
      ♡
    </button>

    <button
      class="icon"
      type="button"
      onclick="showPage('profile')"
    >
      ●
    </button>

  </div>

</header>


<div class="layout">

<aside class="sidebar">

  <div class="brand-card">

    <b>VYBE</b>

    <p>
      Your world. Your people. Your story.
    </p>

  </div>

  <nav
    class="nav-list"
    id="sideNav"
  ></nav>

</aside>


<main id="main"></main>


<aside class="rightbar">

  <div class="card right-card">

    <h3>
      VYBE Now
    </h3>

    <div class="mini">

      <span>🔥</span>

      <div>
        <b>Daily Challenge</b>
        <small class="muted">
          Make today's VYBE
        </small>
      </div>

    </div>

    <div class="mini">

      <span>🎮</span>

      <div>
        <b>Gaming Hub</b>
        <small class="muted">
          Play. Watch. Connect.
        </small>
      </div>

    </div>

    <div class="mini">

      <span>✨</span>

      <div>
        <b>Creators</b>
        <small class="muted">
          Build your community
        </small>
      </div>

    </div>

  </div>


  <div class="card right-card">

    <h3>
      Your VYBE
    </h3>

    <div class="mini">

      <span>⚡</span>

      <div>
        <b id="rightLevel">
          Level 1
        </b>

        <small
          class="muted"
          id="rightXp"
        >
          0 XP
        </small>
      </div>

    </div>

    <div class="mini">

      <span>🪙</span>

      <div>

        <b id="rightCoins">
          0 Coins
        </b>

        <small class="muted">
          Earn and spend in VYBE
        </small>

      </div>

    </div>

  </div>

</aside>

</div>


<nav
  class="bottom-nav"
  id="bottomNav"
></nav>


<div id="modalRoot"></div>

<div
  id="toast"
  class="toast"
></div>

</div>


<script>

const SUPABASE_URL =
  "https://olttlqjgzxtvriyoipe.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_2uhP7sc-G8MG-tJfNpH6GQ_6z4uaDZC";


const sb =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


const nav = [

  ["home","⌂","Home"],

  ["discover","◉","Discover"],

  ["create","＋","Create"],

  ["live","●","LIVE"],

  ["profile","●","Profile"],

  ["messages","✉","Messages"],

  ["challenges","🏆","Challenges"],

  ["communities","👥","Communities"],

  ["gaming","🎮","Gaming"],

  ["music","♫","Music"],

  ["events","📅","Events"],

  ["notifications","♡","Notifications"],

  ["wallet","🪙","Wallet"],

  ["creator","★","Creator Hub"],

  ["vybeplus","V+","VYBE+"],

  ["ai","✦","VYBE AI"],

  ["local","⌖","VYBE Local"],

  ["rooms","◈","VYBE Rooms"],

  ["match","♡","VYBE Match"],

  ["settings","⚙","Settings"]

];


let state = {

  user:null,

  profile:null,

  liked:{},

  following:{},

  coins:Number(
    localStorage.getItem("vybe_coins") || 0
  ),

  xp:Number(
    localStorage.getItem("vybe_xp") || 0
  ),

  posts:JSON.parse(
    localStorage.getItem("vybe_posts") || "[]"
  ),

  theme:
    localStorage.getItem("vybe_theme")
    || "default"

};


function esc(value){

  return String(
    value ?? ""
  ).replace(
    /[&<>'"]/g,
    function(c){

      return {

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        "'":"&#39;",
        '"':"&quot;"

      }[c];

    }
  );

}


function initials(name){

  return (
    name
    || "V"
  )
  .trim()
  .charAt(0)
  .toUpperCase()
  || "V";

}


function toast(message){

  const t =
    document.getElementById(
      "toast"
    );

  t.textContent =
    message;

  t.style.display =
    "block";

  clearTimeout(
    window._toast
  );

  window._toast =
    setTimeout(
      function(){

        t.style.display =
          "none";

      },
      2600
    );

}


function addXP(amount){

  state.xp += amount;

  localStorage.setItem(
    "vybe_xp",
    state.xp
  );

  renderRight();

}


function renderRight(){

  const level =
    Math.floor(
      state.xp / 100
    ) + 1;

  document.getElementById(
    "rightLevel"
  ).textContent =
    "Level " + level;

  document.getElementById(
    "rightXp"
  ).textContent =
    state.xp + " XP";

  document.getElementById(
    "rightCoins"
  ).textContent =
    state.coins + " Coins";

}


function showPage(name){

  document
    .querySelectorAll(".page")
    .forEach(
      function(page){

        page.classList.remove(
          "active"
        );

      }
    );


  const page =
    document.getElementById(
      "page-" + name
    );


  if(page){

    page.classList.add(
      "active"
    );

  }


  document
    .querySelectorAll(
      ".nav-item,.bottom-nav button"
    )
    .forEach(
      function(button){

        button.classList.toggle(
          "active",
          button.dataset.page === name
        );

      }
    );


  window.scrollTo(
    0,
    0
  );

}


function navButton(item){

  return `

    <button
      type="button"
      class="nav-item"
      data-page="${item[0]}"
      onclick="showPage('${item[0]}')"
    >

      <span class="nav-icon">
        ${item[1]}
      </span>

      <span>
        ${item[2]}
      </span>

    </button>

  `;

}


function buildNav(){

  document.getElementById(
    "sideNav"
  ).innerHTML =
    nav
    .map(navButton)
    .join("");


  const bottom =
    nav
    .slice(0,5)
    .map(
      function(item){

        return `

          <button
            type="button"
            data-page="${item[0]}"
            onclick="showPage('${item[0]}')"
          >

            <b>
              ${item[1]}
            </b>

            <span>
              ${item[2]}
            </span>

          </button>

        `;

      }
    )
    .join("");


  document.getElementById(
    "bottomNav"
  ).innerHTML =
    bottom;

}


function page(
  id,
  title,
  body
){

  return `

    <section
      id="page-${id}"
      class="page"
    >

      <div class="section-head">

        <h2>
          ${title}
        </h2>

        <span class="pill">
          VYBE
        </span>

      </div>

      ${body}

    </section>

  `;

}


function featurePage(
  id,
  title,
  icon,
  description,
  actions
){

  return page(
    id,
    title,

    `

      <div class="card">

        <div class="row">

          <div class="avatar">
            ${icon}
          </div>

          <div>

            <h2>
              ${title}
            </h2>

            <p class="muted">
              ${description}
            </p>

          </div>

        </div>


        <div
          class="feature-list"
          style="margin-top:18px"
        >

          ${actions
            .map(
              function(action){

                return `

                  <div class="feature">

                    <div class="feature-left">

                      <span class="feature-icon">
                        ${action[0]}
                      </span>

                      <div>

                        <b>
                          ${action[1]}
                        </b>

                        <small>
                          ${action[2]}
                        </small>

                      </div>

                    </div>


                    <button
                      class="secondary"
                      type="button"
                      onclick="featureAction(
                        '${id}',
                        '${action[1].replace(
                          /'/g,
                          "\\'"
                        )}'
                      )"
                    >
                      Open
                    </button>

                  </div>

                `;

              }
            )
            .join("")}

        </div>

      </div>

    `

  );

}


function render(){

  const main =
    document.getElementById(
      "main"
    );

  let html = "";


  html += page(
    "home",

function renderFeed(){

  const box =
    document.getElementById(
      "feed"
    );


  if(!box){
    return;
  }


  const samples = [

    {
      name:"VYBE",
      handle:"@vybe",
      text:
        "Your world. Your people. Your story. Welcome to the VYBE."
    },

    {
      name:"Gaming Hub",
      handle:"@gaming",
      text:
        "Who is ready for today's challenge? 🎮🔥"
    }

  ];


  const posts = [
    ...state.posts,
    ...samples
  ];


  box.innerHTML =
    posts
    .map(
      function(post,index){

        return `

          <article class="feed-item">

            <div class="row between">

              <div class="row">

                <div class="avatar">
                  ${initials(
                    post.name
                  )}
                </div>


                <div>

                  <b>
                    ${esc(
                      post.name
                    )}
                  </b>

                  <div class="muted">

                    ${esc(
                      post.handle
                      || "@vybe"
                    )}

                    · VYBE

                  </div>

                </div>

              </div>


              <button
                class="secondary"
                type="button"
                onclick="followUser(
                  '${esc(
                    post.handle
                    || "@vybe"
                  )}'
                )"
              >
                Follow
              </button>

            </div>


            <div class="feed-body">

              ${esc(
                post.text
              )}

            </div>


            <div class="feed-actions">

              <button
                type="button"
                onclick="likePost(${index})"
              >

                ♡

                ${
                  state.liked[index]
                  ? "Liked"
                  : "Like"
                }

              </button>


              <button
                type="button"
                onclick="commentPost()"
              >
                💬 Comment
              </button>


              <button
                type="button"
                onclick="sharePost()"
              >
                ↗ Share
              </button>

            </div>

          </article>

        `;

      }
    )
    .join("");

}


function createPost(){

  const element =
    document.getElementById(
      "postText"
    );


  if(
    !element ||
    !element.value.trim()
  ){

    toast(
      "Write something first."
    );

    return;

  }


  if(!state.user){

    openAuthModal(
      "signup"
    );

    toast(
      "Create your account first to post."
    );

    return;

  }


  const displayName =
    state.profile?.display_name
    || state.user.email.split("@")[0];


  const username =
    state.profile?.username
    || "user";


  state.posts.unshift({

    name:displayName,

    handle:
      "@" + username,

    text:
      element.value.trim()

  });


  localStorage.setItem(
    "vybe_posts",
    JSON.stringify(
      state.posts.slice(
        0,
        50
      )
    )
  );


  element.value =
    "";


  addXP(10);

  renderFeed();

  showPage("home");

  toast(
    "Your VYBE was posted."
  );

}


function likePost(index){

  state.liked[index] =
    !state.liked[index];


  if(
    state.liked[index]
  ){

    addXP(2);

  }


  renderFeed();

}


function commentPost(){

  if(!state.user){

    openAuthModal(
      "signup"
    );

    return;

  }


  const text =
    prompt(
      "Comment on this VYBE:"
    );


  if(
    text &&
    text.trim()
  ){

    addXP(2);

    toast(
      "Comment added."
    );

  }

}


function sharePost(){

  if(
    navigator.clipboard
  ){

    navigator.clipboard.writeText(
      location.href
    );

  }


  addXP(1);

  toast(
    "VYBE link copied."
  );

}


function followUser(handle){

  if(!state.user){

    openAuthModal(
      "signup"
    );

    return;

  }


  state.following[
    handle
  ] = true;


  addXP(2);

  toast(
    "Following " +
    handle
  );

}

  section,
  feature
){

    feature === "Sign Out"

    return;

  toast(
    feature +
    " is connected to the VYBE feature map."
  );

}

async function saveProfile(){

  const displayName =
    document
      .getElementById(
        "editName"
      )
      .value
      .trim();


  const username =
    document
      .getElementById(
        "editUsername"
      )
      .value
      .trim()
      .toLowerCase()
      .replace(
        /[^a-z0-9_]/g,
        ""
      );


  const bio =
    document
      .getElementById(
        "editBio"
      )
      .value
      .trim();


  if(
    !displayName ||
    !username
  ){

    toast(
      "Display name and username are required."
    );

    return;

  }


  const message =
    document.getElementById(
      "profileMsg"
    );


  try{

    const {
      error:authError
    } =
      await sb.auth.updateUser({

        data:{
          display_name:
            displayName,

          username:
            username,

          bio:
            bio
        }

      });


    if(authError){
      throw authError;
    }


    const {
      error
    } =
      await sb
        .from("profiles")
        .upsert(
          {
            id:
              state.user.id,

            username:
              username,

            display_name:
              displayName,

            bio:
              bio

          },
          {
            onConflict:
              "id"
          }
        );


    if(error){

      console.warn(
        "Profile table update:",
        error.message
      );

    }


    state.profile = {

      ...(state.profile || {}),

      display_name:
        displayName,

      username:
        username,

      bio:
        bio

    };


    render();

    closeModal();

    toast(
      "Profile updated."
    );

  }catch(error){

    message.textContent =
      error.message;

    message.className =
      "message error";

    message.style.display =
      "block";

  }

}


function openAuthModal(
  mode = "signup"
){

  document.getElementById(
    "modalRoot"
  ).innerHTML = `

    <div
      class="modal"
      onclick="
        if(event.target===this)
        closeModal()
      "
    >

      <div class="modal-box">

        <h2 id="authTitle">

          ${
            mode === "login"
              ? "Welcome Back to VYBE"
              : "Create Your VYBE Account"
          }

        </h2>


        <p class="modal-sub">

          Your account is the foundation
          of your VYBE identity.

        </p>


        <div
          id="signupFields"
          class="form-grid
            ${
              mode === "login"
                ? "hidden"
                : ""
            }"
        >

          <label>

            <span class="form-label">
              Display name
            </span>

            <input
              class="field"
              id="authName"
              placeholder="Your display name"
            >

          </label>


          <label>

            <span class="form-label">
              Username
            </span>

            <input
              class="field"
              id="authUsername"
              placeholder="your_username"
            >

          </label>


          <label>

            <span class="form-label">
              Date of birth
            </span>

            <input
              class="field"
              id="authDob"
              type="date"
            >

          </label>

        </div>


        <div
          class="form-grid"
          style="margin-top:11px"
        >

          <label>

            <span class="form-label">
              Email
            </span>

            <input
              class="field"
              id="authEmail"
              type="email"
              autocomplete="email"
              placeholder="you@example.com"
            >

          </label>


          <label>

            <span class="form-label">
              Password
            </span>

            <input
              class="field"
              id="authPassword"
              type="password"
              autocomplete="new-password"
              placeholder="At least 6 characters"
            >

          </label>

        </div>


        <div class="modal-actions">

          <button

            type="button"
            onclick="
              submitAuth('${mode}')
            "
          >

              mode === "login"
                ? "Log In"
                : "Create Account"
            }

          </button>


          <button
            class="secondary"
            type="button"
            onclick="
              toggleAuthMode(
                '${
                  mode === "login"
                    ? "signup"
                    : "login"
                }'
              )
            "
          >

            ${
              mode === "login"
                ? "Create a new account"
                : "Already have an account? Log in"
            }

          </button>


          <button
            class="secondary"
            type="button"
            onclick="closeModal()"

        <div

        ></div>

      </div>

    </div>

  `;

}


function toggleAuthMode(
  mode
){

  openAuthModal(
    mode
  );

}


function ageFromDob(
  dob
){

  const date =
    new Date(
      dob
    );


  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return null;

  }


  const now =
    new Date();


  let age =
    now.getFullYear()
    -
    date.getFullYear();


  const month =
    now.getMonth()
    -
    date.getMonth();


  if(
    month < 0 ||
    (
      month === 0 &&
      now.getDate()
      <
      date.getDate()
    )
  ){

    age--;

  }


  return age;

}


async function submitAuth(
  mode
){

  const email =
    document
      .getElementById(
        "authEmail"
      )
      .value
      .trim();


  const password =
    document
      .getElementById(
        "authPassword"
      )
      .value;


  const message =
    document.getElementById(
      "authMsg"
    );


  function fail(text){

    message.textContent =
      text;

    message.className =
      "message error";

    message.style.display =
      "block";

  }


  if(
    !email ||
    !password
  ){

    fail(
      "Email and password are required."
    );

    return;

  }


  if(
    password.length < 6
  ){

    fail(
      "Password must be at least 6 characters."
    );

    return;

  }


  if(
    mode === "login"
  ){

    const {
      data,
      error
    } =
      await sb.auth.signInWithPassword({

        email:
          email,

        password:
          password

      });


    if(error){

      fail(
        error.message
      );

      return;

    }


    closeModal();

    await loadUser();

    toast(
      "Welcome back to VYBE."
    );

    return;

  }


  const name =
    document
      .getElementById(
        "authName"
      )
      .value
      .trim();


  const username =
    document
      .getElementById(
        "authUsername"
      )
      .value
      .trim()
      .toLowerCase()
      .replace(
        /[^a-z0-9_]/g,
        ""
      );


  const dob =
    document.getElementById(
      "authDob"
    ).value;


  const age =
    ageFromDob(
      dob
    );


  if(
    !name ||
    !username ||
    !dob
  ){

    fail(
      "Please complete your name, username and date of birth."
    );

    return;

  }


  if(
    age === null ||
    age < 13
  ){

    fail(
      "VYBE currently requires members to be 13 or older."
    );

    return;

  }


  const ageGroup =
    age >= 18
      ? "adult"
      : "teen";


  const {
    data,
    error
  } =
    await sb.auth.signUp({

      email:
        email,

      password:
        password,

      options:{

        data:{

          display_name:
            name,

          username:
            username,

          dob:
            dob,

          age_group:
            ageGroup,

          bio:
            "Your VYBE. Your people. Your story."

        }

      }

    });


  if(error){

    fail(
      error.message
    );

    return;

  }


  if(data.user){

    state.user =
      data.user;


    state.profile = {

      display_name:
        name,

      username:
        username,

      dob:
        dob,

      age_group:
        ageGroup,

      bio:
        "Your VYBE. Your people. Your story."

    };


    const {
      error:profileError
    } =
      await sb
        .from("profiles")
        .upsert(
          {

            id:
              data.user.id,

            username:
              username,

            display_name:
              name,

            dob:
              dob,

            age_group:
              ageGroup,

            bio:
              "Your VYBE. Your people. Your story."

          },
          {
            onConflict:
              "id"
          }
        );


    if(profileError){

      console.warn(
        "profiles upsert:",
        profileError.message
      );

    }

  }


  closeModal();

  render();

  showPage(
    "profile"
  );


  if(data.session){

    toast(
      "Your VYBE account is ready."
    );

  }else{

    toast(
      "Check your email to confirm your VYBE account."
    );

  }

}


async function loadUser(){

  const {
    data
  } =
    await sb.auth.getUser();


  if(
    !data ||
    !data.user
  ){

    state.user =
      null;

    state.profile =
      null;

    render();

    return;

  }


  state.user =
    data.user;


  const metadata =
    data.user.user_metadata
    || {};


  let profile = {

    display_name:
      metadata.display_name
      ||
      data.user.email
      ?.split("@")[0]
      ||
      "VYBE User",

    username:
      metadata.username
      ||
      "username",

    dob:
      metadata.dob
      ||
      "",

    age_group:
      metadata.age_group
      ||
      "adult",

    bio:
      metadata.bio
      ||
      "Your VYBE. Your people. Your story."

  };


  const {
    data:row
  } =
    await sb
      .from("profiles")
      .select(
        "id,username,display_name,dob,age_group,avatar_url,bio"
      )
      .eq(
        "id",
        data.user.id
      )
      .maybeSingle();


  if(row){

    profile = {

      ...profile,

      ...row

    };

  }


  state.profile =
    profile;


  render();

}


async function signOut(){

  await sb.auth.signOut();


  state.user =
    null;

  state.profile =
    null;


  render();

  showPage(
    "home"
  );


  toast(
    "Signed out of VYBE."
  );

}


sb.auth.onAuthStateChange(
  function(
    event,
    session
  ){

    if(
      session &&
      !state.user
    ){

      loadUser();

    }

  }
);


buildNav();

render();

loadUser();

renderRight();

</script>
