async function startLive(){
  if(!state.user){
    openAuthModal('signup');
    return;
  }

  try{
    const {data,error}=await sb.rpc('get_my_active_live');

    if(!error && data){
      const live=Array.isArray(data)?data[0]:data;

      if(live && live.stream_id){
        openModal(`
          <h2>Active VYBE LIVE Found</h2>
          <p class="modal-sub">
            You already have an active LIVE session.
          </p>

          <div class="card" style="margin:12px 0">
            <b>${esc(live.title||'VYBE LIVE')}</b>
            <p class="muted" style="margin-top:6px">
              Status: ${esc(live.status||'live')}
            </p>
          </div>

          <div class="modal-actions">
            <button class="primary"
              onclick="closeModal();showPage('live')">
              Resume Active LIVE
            </button>

            <button class="danger"
              onclick="endVYBEActiveLive('${live.stream_id}')">
              End Active LIVE
            </button>

            <button class="secondary"
              onclick="closeModal()">
              Cancel
            </button>
          </div>
        `);
        return;
      }
    }
  }catch(e){
    console.warn('Active LIVE check:',e);
  }

  openModal(`
    <h2>Start VYBE LIVE</h2>
    <p class="modal-sub">
      Set up your LIVE before you go on air.
    </p>

    <div class="form-grid">
      <input id="liveTitle"
        class="field"
        placeholder="LIVE title">

      <select id="liveCategory" class="field">
        <option>Gaming</option>
        <option>Just Chatting</option>
        <option>Music</option>
        <option>Creator</option>
        <option>Business</option>
      </select>

      <select id="liveGuests" class="field">
        <option value="everyone">Guest requests: Everyone</option>
        <option value="followers">Followers only</option>
        <option value="subscribers">Subscribers only</option>
        <option value="off">Guest requests off</option>
      </select>
    </div>

    <button class="primary"
      style="width:100%"
      onclick="confirmStartLive()">
      Go LIVE
    </button>
  `);
}
  async function endVYBEActiveLive(streamId){
  if(!streamId)return;

  try{
    const {data,error}=await sb.rpc('end_vybe_live',{
      p_stream_id:streamId
    });

    if(error){
      console.error('End active LIVE:',error);
      toast(error.message||'Could not end the active LIVE.');
      return;
    }

    state.live=null;
    localStorage.removeItem('vybe_live');
    closeModal();
    toast('Active LIVE ended. You can start a new LIVE now.');
  }catch(e){
    console.error('End active LIVE:',e);
    toast('Could not end the active LIVE.');
  }
  }

function ageFromDob(dob){const d=new Date(dob);if(Number.isNaN(d.getTime()))return null;const n=new Date();let a=n.getFullYear()-d.getFullYear();if(n.getMonth()<d.getMonth()||(n.getMonth()===d.getMonth()&&n.getDate()<d.getDate()))a--;return a}
async function submitAuth(mode){const email=document.getElementById('authEmail').value.trim();const password=document.getElementById('authPassword').value;const msg=document.getElementById('authMsg');const fail=t=>{msg.textContent=t;msg.className='message error';msg.style.display='block'};if(!email||!password)return fail('Email and password are required.');if(password.length<6)return fail('Password must be at least 6 characters.');try{if(mode==='login'){const {error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;closeModal();await loadUser();toast('Welcome back to VYBE.');return}const name=document.getElementById('authName').value.trim();const username=document.getElementById('authUsername').value.trim().toLowerCase().replace(/[^a-z0-9_]/g,'');const dob=document.getElementById('authDob').value;const age=ageFromDob(dob);if(!name||!username||!dob)return fail('Please complete your name, username and date of birth.');if(age===null||age<13)return fail('VYBE currently requires members to be 13 or older.');const ageGroup=age>=18?'adult':'teen';const {data,error}=await sb.auth.signUp({email,password,options:{data:{display_name:name,username,bio:'',dob,age_group:ageGroup}}});if(error)throw error;if(data.user){await sb.from('profiles').upsert({id:data.user.id,username,display_name:name,dob,age_group:ageGroup,bio:''},{onConflict:'id'})}msg.className='message';msg.textContent='Account created. If email confirmation is enabled, check your email before logging in.';msg.style.display='block'}catch(e){fail(e.message||'Unable to connect to VYBE.')}}

async function saveProfile(){
  const name=document.getElementById('editName')?.value.trim()||'';
  const username=document.getElementById('editUsername')?.value.trim().toLowerCase().replace(/[^a-z0-9_]/g,'')||'';
  const bio=document.getElementById('editBio')?.value.trim()||'';
  const headline=document.getElementById('editHeadline')?.value.trim()||'';

  if(!name||!username){
    toast('Display name and username are required.');
    return;
  }

  if(!state.user){
    toast('Please log in first.');
    return;
  }

  try{
    const {data,error}=await sb.from('profiles')
      .update({
        username:username,
        display_name:name,
        bio:bio,
        headline:headline,
        updated_at:new Date().toISOString()
      })
      .eq('id',state.user.id)
      .select('*')
      .single();

    if(error)throw error;
    if(!data)throw new Error('Profile could not be saved.');

    state.profile=data;
    closeModal();
    render();
    toast('Profile saved successfully.');
  }catch(e){
    toast('Could not save profile: '+(e.message||'Unknown error'));
    console.error(e);
  }
}
async function createPost(){
  if(!state.user){
    openAuthModal('signup');
    return;
  }

  const el=document.getElementById('postText');
  const text=el?.value.trim()||'';

  if(!text){
    toast('Write something first.');
    return;
  }

  try{
    const {data,error}=await sb.from('posts')
      .insert({
        user_id:state.user.id,
        content:text
      })
      .select('*')
      .single();

    if(error)throw error;

    state.posts.unshift({
      id:data.id,
      text:data.content,
      name:state.profile?.display_name||'VYBE Creator',
      username:state.profile?.username||'creator',
      location:'VYBE',
      created_at:data.created_at
    });

    el.value='';
    addXP(10);
    render();
    toast('VYBE posted successfully.');
  }catch(e){
    toast('Could not post VYBE: '+(e.message||'Unknown error'));
  }
}
async function loadSupabasePosts(){
  if(!state.user)return;

  try{
    const {data,error}=await sb.from('posts')
      .select('id,user_id,content,image_url,created_at,updated_at')
      .order('created_at',{ascending:false})
      .limit(50);

    if(error)throw error;

    const rows=data||[];
    const ids=[...new Set(rows.map(x=>x.user_id).filter(Boolean))];
    let profiles=[];

    if(ids.length){
      const result=await sb.from('profiles')
        .select('id,username,display_name,avatar_url')
        .in('id',ids);

      if(result.error)throw result.error;
      profiles=result.data||[];
    }

    const profileMap={};
    profiles.forEach(p=>profileMap[p.id]=p);

    state.posts=rows.map(x=>{
      const p=profileMap[x.user_id]||{};
      return {
        id:x.id,
        text:x.content||'',
        name:p.display_name||'VYBE Creator',
        username:p.username||'creator',
        avatar_url:p.avatar_url||'',
        location:'VYBE',
        created_at:x.created_at
      };
    });

    window._supabaseFeedReady=true;
    render();
  }catch(e){
    console.error(e);
    toast('Could not load VYBE feed.');
  }
}

function renderFeed(){
  if(!window._supabaseFeedReady){
    if(state.user&&!window._supabaseFeedLoading){
      window._supabaseFeedLoading=true;
      loadSupabasePosts();
    }
  }

  const posts=[...state.posts];

  if(!posts.length){
    return `<div class="section-head"><h2>For You</h2></div>

  window.loadVYBEFYP=async function(){

    const feed=document.getElementById('vybeFypFeed');

    feed.innerHTML=`<div id="vybeFypLoading">Loading VYBEs...</div>`;

    try{

      const {data,error}=await sb.rpc(

            }

          ></video>

                 </div>`

  function setupVYBEFYPObserver(){

    const videos=document.querySelectorAll(
      '#vybeFypFeed .vybe-fyp-video'
    );

    const observer=new IntersectionObserver(
      entries=>{

        entries.forEach(entry=>{

          const video=entry.target;
          const item=video.closest('.vybe-fyp-item');

          if(entry.isIntersecting && entry.intersectionRatio>=0.7){

            videos.forEach(other=>{
              if(other!==video){
                try{other.pause();}catch(e){}
              }
            });

            video.muted=false;

            video.play().catch(()=>{
              video.muted=true;
              video.play().catch(()=>{});
            });

            const id=item?.dataset?.videoId;

            if(id){
              recordVYBEView(id,video);
            }

          }else{

            try{video.pause();}catch(e){}

          }

        });

      },
      {threshold:[0.7]}
    );

    videos.forEach(video=>observer.observe(video));
  }

  async function recordVYBEView(videoId,video){

    if(!state.user)return;

    try{

      await sb.rpc(
        'record_video_view',
        {
          p_video_id:videoId,
          p_watch_seconds:Number(video.currentTime||0),
          p_completed:false
        }
      );

    }catch(e){
      console.error(e);
    }
  }

  window.likeVYBEVideo=async function(videoId){

    try{

      const {data,error}=await sb
        .from('video_likes')
        .select('id')
        .eq('video_id',videoId)
        .eq('user_id',state.user.id)
        .maybeSingle();

      if(error)throw error;

      if(data){

        await sb
          .from('video_likes')
          .delete()
          .eq('id',data.id);

      }else{

        await sb
          .from('video_likes')
          .insert({
            video_id:videoId,
            user_id:state.user.id
          });

      }

      loadVYBEFYP();

    try{

        });

  window.shareVYBEVideo=async function(videoId){

      await sb
        .from('video_shares')
        .insert({
          video_id:videoId,
          user_id:state.user.id
        });

    }catch(e){
      console.error(e);
    }

    try{

      if(navigator.share){

        await navigator.share({
          title:'VYBE',
          text:'Check out this VYBE video!'
        });

      }else{

        await navigator.clipboard.writeText(
          location.href
        );

      }

    }catch(e){}

    loadVYBEFYP();
  };

  window.giftVYBEVideo=function(videoId){

      openAuthModal('login');
      return;

  };

  window.uploadVYBEFYPVideo=async function(input){

    const file=input?.files?.[0];

    if(!file)return;

    if(!state.user){
      toast('Please log in first.');
      return;
    }

    if(!file.type.startsWith('video/')){
      toast('Please choose a video file.');
      return;
    }

    if(file.size>250*1024*1024){
      toast('Video must be smaller than 250 MB.');
      input.value='';
      return;
    }

    toast('Uploading your VYBE...');

    try{

      const ext=
        (file.name.split('.').pop()||'mp4')
        .toLowerCase();

      const path=
        state.user.id+
        '/' +
        crypto.randomUUID()+
        '.'+
        ext;

      const upload=await sb
        .storage
        .from('videos')
        .upload(path,file,{
          cacheControl:'3600',
          upsert:false,
          contentType:file.type
        });

      if(upload.error)throw upload.error;

      const publicUrl=
        sb.storage
          .from('videos')
          .getPublicUrl(path)
          .data
          .publicUrl;

      const caption=
        prompt('Write a caption for your VYBE video:')||'';

      const {error}=await sb
        .from('videos')
        .insert({
          user_id:state.user.id,
          video_url:publicUrl,
          caption:caption,
          visibility:'public'
        });

      if(error)throw error;

      input.value='';

      toast('VYBE video uploaded successfully.');

      await loadVYBEFYP();

    }catch(e){

      console.error(e);

      toast(
        'Video upload failed: '+
        (e.message||'Unknown error')
      );

    }
  };

  function addFYPButton(){

    if(document.getElementById('vybeFypNavButton'))return;

    const candidates=[
      ...document.querySelectorAll('button'),
      ...document.querySelectorAll('[role="button"]')
    ];

    const home=candidates.find(el=>{
      const t=(el.textContent||'').trim().toLowerCase();
      return t==='home'||t.includes('home');
    });

    if(!home)return;

    const btn=home.cloneNode(true);

    btn.id='vybeFypNavButton';
    btn.innerHTML='▶ FYP';

    btn.onclick=function(e){
      e.preventDefault();
      e.stopPropagation();
      openVYBEFYP();
    };

    home.parentNode.insertBefore(btn,home.nextSibling);
  }

  function startFYPNavWatcher(){

    addFYPButton();

    const observer=new MutationObserver(()=>{
      addFYPButton();
    });

    observer.observe(document.body,{
      childList:true,
      subtree:true
    });

    setTimeout(addFYPButton,500);
    setTimeout(addFYPButton,1500);
    setTimeout(addFYPButton,3000);
  }

  if(document.readyState==='loading'){

    document.addEventListener(
      'DOMContentLoaded',
      startFYPNavWatcher
    );

  }else{

    startFYPNavWatcher();

  }

 })();

(function () {

  function lockFinancialState() {

    if (typeof state === 'undefined') return;

window.startCoinCheckout = async function (packageId, currency = 'ZAR') {

      throw new Error('PayPal did not provide a checkout link.');
    }

    window.location.href = data.approvalUrl;

  } catch (error) {

    console.error('VYBE PayPal checkout:', error);

    if (msg) {
      msg.textContent =
        error.message || 'Could not connect to PayPal.';
      msg.style.display = 'block';

    );
  }

/* Handle the PayPal return to VYBE */

(function handlePayPalReturn() {

  const params = new URLSearchParams(
    window.location.search
  );

  const paypalStatus = params.get('paypal');
  const orderId = params.get('token');

  if (paypalStatus === 'cancelled') {

    setTimeout(function () {
      toast('PayPal payment cancelled.');
    }, 700);

    window.history.replaceState(
      {},
      document.title,
      window.location.pathname
    );

    return;
  }

  if (
    paypalStatus !== 'success' ||
    !orderId
  ) {
    return;
  }

  (async function () {

    try {

      toast('Confirming your PayPal payment...');

      const { data, error } =
        await sb.functions.invoke(
          'paypal-capture-order',
          {
            body: {
              orderId: orderId
            }
          }
        );

      if (error) {
        console.error(
          'PayPal capture:',
          error
        );

        throw new Error(
          error.message ||
          'Could not confirm PayPal payment.'
        );
      }

      if (!data?.success) {
        throw new Error(
          data?.error ||
          'PayPal payment could not be confirmed.'
        );
      }

      await window.vybeLoadSecureState();

      toast(
        '🎉 Payment successful! Your VYBE Coins have been added.'
      );

      window.history.replaceState(
        {},
        document.title,
        window.location.pathname
      );

      setTimeout(function () {
        if (typeof buyCoins === 'function') {
          buyCoins();
        }
      }, 500);

    } catch (error) {

      console.error(
        'VYBE PayPal confirmation:',
        error
      );

      toast(
        error.message ||
        'Payment confirmation failed.'
      );

    }

  })();

})();

(function () {

      window.showPage(page);
      return true;
    }
    return false;
  }

  function liveSetup() {
    if (typeof window.vybeOpenLiveSetup === 'function') {
      window.vybeOpenLiveSetup();

      window.openLiveSetup();
      return true;
    }

    go('live');

    if (typeof window.vybeStartCamera === 'function') {

  }

    const t = String(label || '').trim().toLowerCase();

    if (!t) return false;

    /* MAIN NAVIGATION */

    if (t === 'home' || t === 'fyp' || t === 'for you') {
      return go('home');
    }

    if (t === 'discover' || t === 'search') {
      return go('discover');
    }

    if (t === 'messages' || t === 'message' || t === 'chat') {
      return go('messages');
    }

    if (t === 'profile' || t === 'me') {
      return go('profile');
    }

    if (t === 'notifications' || t === 'activity') {

    }

    if (t === 'music' || t === 'sounds') {
      return go('music');
    }

    if (t === 'store' || t === 'shop') {

  /* Capture button clicks before old toast-only handlers run. */

  document.addEventListener(
    'click',
    function (event) {
      const button = event.target.closest(
        'button, [role="button"], .nav-item, .action-btn, .tool-btn'
      );

      if (!button) return;

      const text =
        button.getAttribute('aria-label') ||
        button.getAttribute('title') ||
        button.textContent ||
        '';

      const handled = route(text);

      if (handled) {
        event.preventDefault();
        event.stopImmediatePropagation();
      }
    },
    true
  );

  /* Keep tab navigation alive when tabs have no onclick. */

  function wireTabs() {
    document.querySelectorAll(
      '.profile-tab, .profile-tabs button, .profile-tabs [role="tab"]'
    ).forEach(tab => {
      if (tab.dataset.vybeWired === '1') return;

      tab.dataset.vybeWired = '1';

      tab.addEventListener('click', function () {
        const label = (
          this.textContent ||
          this.getAttribute('aria-label') ||
          ''
        ).trim().toLowerCase();

        if (label === 'saved') {
          window.openVYBEProfileCollection?.('saved');
        }

        if (label === 'liked') {
          window.openVYBEProfileCollection?.('liked');
        }

        if (label === 'reposts') {
          window.openVYBEProfileCollection?.('reposts');
        }

        if (label === 'jobs') {
          go('jobs');
        }
      });
    });
  }
